<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B31 — Agendamento</title>
<style>
  :root{
    --black:#0A0A0A;
    --dark:#1C1C1C;
    --gray-700:#3D3D3D;
    --gray-500:#6E6E6E;
    --gray-300:#B8B8B8;
    --gray-100:#E8E8E8;
    --white:#FFFFFF;
    --line:#DADADA;
    --gold:#C9A227;
    --gold-dark:#9C7D1F;
    --gold-soft:#F1E4B8;
    --page-bg:#F5F4F1;
    --barber-red:#C1272D;
    --barber-blue:#1D4E89;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .display{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:700;
    letter-spacing:0.02em;
  }
  [role="button"]{ cursor:pointer; }
  [role="button"]:focus-visible,
  button:focus-visible,
  .backlink:focus-visible,
  a:focus-visible{
    outline:2px solid var(--black);
    outline-offset:2px;
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .field-error{
    color:var(--black);
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    display:none;
  }
  .field-error.show{ display:block; }
  input.invalid{
    border-color:var(--black);
    border-width:2px;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 24px 60px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(10,10,10,0.05);
  }
  .card h2{
    margin:0 0 4px;
    padding-bottom:9px;
    font-size:18px;
    position:relative;
  }
  .card h2::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:26px; height:3px;
    border-radius:2px;
    background:var(--gold);
  }
  .appts-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .appts-head h2{ flex:1; }
  .appts-head .ghost{ flex-shrink:0; }
  .card .sub{
    margin:0 0 16px;
    font-size:13px;
    color:var(--gray-500);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
    color:var(--black);
  }
  input[type=text], input[type=tel], input[type=password], select{
    width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:14px;
    background:var(--white);
    color:var(--black);
  }
  input:focus, select:focus{
    outline:2px solid var(--black);
    outline-offset:1px;
  }
  .services{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:10px;
    margin-top:6px;
  }
  .svc{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px;
    cursor:pointer;
    background:var(--white);
  }
  .svc.selected{
    border-color:var(--gold-dark);
    background:var(--gold-soft);
  }
  .svc .name{font-weight:600; font-size:14px;}
  .svc .meta{font-size:12px; color:var(--gray-500); margin-top:2px;}
  .days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-top:6px;
  }
  .day{
    min-width:64px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 6px;
    cursor:pointer;
    background:var(--white);
    font-size:12px;
  }
  .day .dow{color:var(--gray-500); text-transform:uppercase; font-size:10px;}
  .day .num{font-weight:700; font-size:16px;}
  .day.selected{
    border-color:var(--gold);
    background:var(--black);
    color:var(--white);
  }
  .day.selected .dow{color:var(--gray-300);}
  .slots{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(72px,1fr));
    gap:8px;
    margin-top:6px;
  }
  .slot{
    padding:8px 4px;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    cursor:pointer;
  }
  .slot.selected{
    background:var(--black);
    border-color:var(--gold);
    color:var(--white);
    font-weight:600;
  }
  .slot.taken{
    color:var(--gray-300);
    text-decoration:line-through;
    cursor:not-allowed;
    background:var(--gray-100);
  }
  button.primary{
    background:var(--black);
    color:var(--white);
    border:none;
    padding:12px 18px;
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
  }
  button.primary:hover{
    background:var(--dark);
    box-shadow:0 4px 14px rgba(201,162,39,0.28);
  }
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    color:var(--black);
  }
  button.danger{
    background:transparent;
    border:1px solid var(--black);
    color:var(--black);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  button.success{
    background:var(--black);
    border:1px solid var(--black);
    color:var(--white);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  button.success:hover{
    background:var(--dark);
  }
  .appt-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .appt.done{
    background:var(--gray-100);
    opacity:0.75;
  }
  .done-badge{
    font-size:12px;
    font-weight:700;
    color:var(--black);
    background:transparent;
    border:1px solid var(--gold);
    padding:5px 10px;
    border-radius:6px;
  }
  .app-toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--black);
    color:var(--white);
    padding:12px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
    z-index:1000;
    max-width:90%;
    text-align:center;
  }
  .app-toast.error{
    background:var(--barber-red);
  }
  .env-banner{
    background:var(--barber-red);
    color:var(--white);
    text-align:center;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
  }
  .error{
    color:var(--black);
    font-weight:600;
    font-size:13px;
    margin-top:6px;
  }
  .success-box{
    text-align:center;
    padding:30px 16px;
  }
  .success-box .badge{
    width:52px;height:52px;border-radius:50%;
    background:var(--black);color:var(--white);
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:26px;font-weight:700;
  }
  .appt{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
    flex-wrap:wrap;
  }
  .appt .who{font-weight:600; font-size:14px;}
  .appt .when{font-size:13px; color:var(--gray-500);}
  .empty{
    color:var(--gray-500);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .weekday-toggle{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .weekday-toggle span{
    padding:6px 10px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:12px;
    cursor:pointer;
    background:var(--white);
  }
  .weekday-toggle span.on{
    background:var(--black);
    color:var(--white);
    border-color:var(--gold);
  }
  .link-box{
    background:var(--gray-100);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:12px;
    color:var(--gray-500);
    margin-top:10px;
  }
  .hint{font-size:12px; color:var(--gray-500); margin-top:4px;}

  /* Landing */
  .landing-wrap{
    padding:0 0 10px;
    text-align:center;
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .landing-hero{
    background:var(--black);
    color:var(--white);
    margin:-24px -24px 26px;
    padding:44px 24px 36px;
    border-radius:0 0 18px 18px;
    border-bottom:3px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  .landing-hero::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.045) 0 12px,
      transparent 12px 24px
    );
    pointer-events:none;
  }
  .landing-hero .lead{
    position:relative;
    font-size:13px;
    color:var(--gray-300);
    max-width:280px;
    margin:14px auto 0;
  }
  .landing-subtitle{
    text-align:left;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--gray-500);
    margin:0 0 10px;
  }
  .landing-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:0;
    text-align:left;
  }
  @media (max-width:560px){ .landing-grid{grid-template-columns:1fr;} }
  .landing-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px 20px;
    cursor:pointer;
    background:var(--white);
    text-align:left;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    animation: fadeUp .4s ease both;
    animation-delay:.05s;
  }
  .landing-grid .landing-card:first-child{ animation-delay:0s; }
  .landing-card:hover{
    border-color:var(--gold-dark);
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(201,162,39,0.16);
  }
  .landing-card .icon{
    width:40px;height:40px;
    border:1px solid var(--black);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
    color:var(--black);
  }
  .landing-card h3{
    margin:0 0 6px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .landing-card h3 .arrow{
    opacity:0;
    transform:translateX(-4px);
    transition:all .15s ease;
    font-size:14px;
    color:var(--gray-500);
  }
  .landing-card:hover h3 .arrow{ opacity:1; transform:translateX(0); }
  .landing-card p{margin:0; font-size:13px; color:var(--gray-500);}
  .staff-note{
    text-align:center;
    margin-top:20px;
    font-size:11px;
    color:var(--gray-300);
  }
  .backlink{
    display:inline-block;
    margin-bottom:14px;
    font-size:13px;
    color:var(--gray-500);
    cursor:pointer;
  }
  .backlink:hover{ color:var(--gold-dark); }
  .authtabs{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  .authtabs button{
    flex:1;
    padding:9px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .authtabs button.active{
    background:var(--black);
    color:var(--white);
    border-color:var(--gold);
  }
  .session-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .session-bar .who{font-size:13px; color:var(--gray-500);}

  /* Auth logo */
  .auth-logo{
    text-align:center;
    margin-bottom:24px;
  }
  .auth-logo .logo-img{
    width:132px;
    height:auto;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.22);
  }
  .auth-logo.on-dark .logo-img{
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .auth-logo .mini-stripe{
    width:72px;
    height:6px;
    margin:12px auto 0;
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.15);
    background: repeating-linear-gradient(
      -45deg,
      var(--barber-red) 0 8px,
      var(--white) 8px 16px,
      var(--barber-blue) 16px 24px,
      var(--white) 24px 32px
    );
  }
  .auth-logo.on-dark{ position:relative; }
  .auth-logo.on-dark .mini-stripe{
    border-color:rgba(255,255,255,0.35);
  }

  /* Barber stats */
  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  @media (max-width:480px){ .stats-grid{grid-template-columns:1fr;} }
  .stat-box{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    background:var(--gray-100);
  }
  .stat-label{
    font-size:12px;
    color:var(--gray-500);
    margin-bottom:4px;
  }
  .stat-value{
    font-size:22px;
    font-weight:700;
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  }
  .stat-value.money{ color:var(--gold-dark); }
</style>
</head>

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function onlyDigits(s){ return String(s || "").replace(/\D/g, ""); }

function formatPhoneInput(value){
  var d = onlyDigits(value).slice(0, 11);
  if(d.length <= 2) return d.length ? "(" + d : "";
  if(d.length <= 7) return "(" + d.slice(0,2) + ") " + d.slice(2);
  return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
}

function isValidPhone(value){
  var d = onlyDigits(value);
  return d.length === 10 || d.length === 11;
}

function isValidPassword(value){
  return String(value || "").length >= 4;
}

// Monta um link wa.me (grátis, sem API paga) com mensagem pré-preenchida.
// O campo salvo em barberConfig.whatsapp guarda só DDD+número (mesma
// máscara do telefone do cliente), então sempre prefixamos o código do
// Brasil (55) antes de montar o link.
function waLink(phoneRaw, message){
  var digits = onlyDigits(phoneRaw);
  if(!digits) return null;
  if(digits.length <= 11){ digits = "55" + digits; }
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
}

function buildBookingWaMessage(confirmed){
  return "Olá! Quero confirmar meu agendamento na Barbearia B31:\n" +
    "Serviço: " + confirmed.serviceName + "\n" +
    "Data: " + confirmed.dateLabel + "\n" +
    "Horário: " + confirmed.time + "\n" +
    "Cliente: " + (state.clientSession ? state.clientSession.name : "");
}

function buildCancelWaMessage(appt){
  var dateLabel = appt.date.split("-").reverse().join("/");
  return "Olá! Preciso cancelar meu agendamento na Barbearia B31:\n" +
    "Serviço: " + appt.serviceName + "\n" +
    "Data: " + dateLabel + "\n" +
    "Horário: " + appt.time + "\n" +
    "Cliente: " + appt.name;
}

function attachPhoneMask(inputEl){
  if(!inputEl) return;
  inputEl.setAttribute("inputmode", "tel");
  inputEl.setAttribute("autocomplete", "tel");
  inputEl.addEventListener("input", function(){
    var pos = inputEl.selectionStart;
    var before = inputEl.value.length;
    inputEl.value = formatPhoneInput(inputEl.value);
    var after = inputEl.value.length;
    var newPos = Math.max(0, pos + (after - before));
    try{ inputEl.setSelectionRange(newPos, newPos); }catch(e){}
  });
}

function makeActivatable(node, handler){
  node.setAttribute("tabindex", "0");
  node.setAttribute("role", "button");
  node.onclick = handler;
  node.onkeydown = function(ev){
    if(ev.key === "Enter" || ev.key === " " || ev.key === "Spacebar"){
      ev.preventDefault();
      handler();
    }
  };
}

async function loadData(){
  try{
    var cfgSnap = await getDoc(doc(db, "barberConfig", "main"));
    if(cfgSnap.exists()){
      state.config = cfgSnap.data();
    } else {
      state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      await setDoc(doc(db, "barberConfig", "main"), state.config);
    }
  }catch(e){
    state.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  }
  state.loaded = true;
}

var toastTimer = null;
function showToast(message, isError){
  var existing = document.getElementById("appToast");
  if(existing) existing.remove();
  var toast = document.createElement("div");
  toast.id = "appToast";
  toast.className = "app-toast" + (isError ? " error" : "");
  toast.setAttribute("role", "status");
  toast.setAttribute("aria-live", "polite");
  toast.textContent = message;
  document.body.appendChild(toast);
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.remove(); }, 4000);
}

// Each save function returns true/false so callers can tell the user when a
// write didn't actually reach storage (e.g. offline) instead of silently
// updating the UI as if it worked.
async function saveConfig(){
  try{ await setDoc(doc(db, "barberConfig", "main"), state.config); return true; }
  catch(e){ return false; }
}

// Cria o agendamento numa transação: o documento tem ID determinístico
// (data_horário), e a transação só escreve se ele ainda não existir. Isso
// elimina a corrida de condição de dois clientes confirmando o mesmo
// horário ao mesmo tempo — o segundo sempre recebe SLOT_TAKEN.
async function bookAppointmentTx(appt){
  var id = apptDocId(appt.date, appt.time);
  var ref = doc(db, "appointments", id);
  await runTransaction(db, async function(tx){
    var existing = await tx.get(ref);
    if(existing.exists()){ throw new Error("SLOT_TAKEN"); }
    tx.set(ref, appt);
  });
  return id;
}

async function cancelApptDoc(id){
  try{ await deleteDoc(doc(db, "appointments", id)); return true; }
  catch(e){ return false; }
}

async function setApptDoneDoc(id, doneVal){
  try{ await updateDoc(doc(db, "appointments", id), { done: !!doneVal }); return true; }
  catch(e){ return false; }
}

// Pulls the latest appointments from Firestore. Needed because each
// person (client or barber) has their own in-memory copy of state — if a
// client books on their phone, the barber's screen doesn't know about it
// until it re-reads. Used on login, on manual refresh, and by the
// background poll below. Loads o histórico inteiro (não só os futuros)
// porque o painel de desempenho do barbeiro precisa dos concluídos
// passados pra calcular saldo da semana/mês/ano.
async function refreshAppts(){
  try{
    var snap = await getDocs(collection(db, "appointments"));
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id: d.id}, d.data())); });
    list.sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    state.appts = list;
    return true;
  }catch(e){ return false; }
}

// Busca só os agendamentos do dia selecionado, usado na tela do cliente
// pra saber quais horários já estão ocupados.
async function refreshClientDateAppts(dateKey){
  try{
    var q = query(collection(db, "appointments"), where("date", "==", dateKey));
    var snap = await getDocs(q);
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id: d.id}, d.data())); });
    state.clientDateAppts = list;
    return true;
  }catch(e){ return false; }
}

// Busca só os agendamentos futuros do próprio cliente logado, usado pra ele
// ver e poder cancelar o que já marcou.
async function refreshClientOwnAppts(){
  if(!state.clientSession) return false;
  try{
    var q = query(collection(db, "appointments"), where("uid", "==", state.clientSession.uid));
    var snap = await getDocs(q);
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id: d.id}, d.data())); });
    list.sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    state.clientOwnAppts = list;
    return true;
  }catch(e){ return false; }
}

function nextDays(n){
  var out = [];
  var today = new Date();
  today.setHours(0,0,0,0);
  var i = 0;
  while(out.length < n && i < 30){
    var d = new Date(today);
    d.setDate(d.getDate() + i);
    if(state.config.workDays.indexOf(d.getDay()) !== -1){ out.push(d); }
    i++;
  }
  return out;
}

function slotsForDate(d, durationMinutes){
  var slots = [];
  var step = state.config.slotMinutes;
  var duration = durationMinutes || step;
  var startMin = state.config.startHour * 60;
  var endMin = state.config.endHour * 60;
  var isToday = dateKey(d) === dateKey(new Date());
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  for(var m = startMin; m + duration <= endMin; m += step){
    if(isToday && m <= nowMin) continue;
    var h = Math.floor(m/60), mm = m%60;
    slots.push(pad(h)+":"+pad(mm));
  }
  return slots;
}

function timeToMinutes(t){
  var parts = t.split(":");
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}

function apptsForDate(dateStr){
  return state.clientDateAppts.filter(function(a){ return a.date === dateStr; });
}

// Checks whether a candidate [startTime, startTime+duration) overlaps any
// existing appointment that day, so a longer service (ex: Corte + Barba)
// correctly blocks out shorter slots that would otherwise fit inside it.
function isSlotAvailable(dateStr, startTime, duration){
  var startMin = timeToMinutes(startTime);
  var endMin = startMin + duration;
  var dayAppts = apptsForDate(dateStr);
  for(var i = 0; i < dayAppts.length; i++){
    var a = dayAppts[i];
    var aStart = timeToMinutes(a.time);
    var aDur = a.minutes || state.config.slotMinutes;
    var aEnd = aStart + aDur;
    if(startMin < aEnd && endMin > aStart){ return false; }
  }
  return true;
}

function isTaken(dateStr, time){
  return !isSlotAvailable(dateStr, time, state.config.slotMinutes);
}

// ---------- BARBER STATS (saldo/trabalhos) ----------
// Instead of keeping a fragile "reset every Monday / every 1st" counter that
// would drift or double count if the barber skips opening the app for a
// while, the weekly/monthly figures are simply recalculated from the
// appointment history every time the panel renders. That naturally "resets"
// the moment a new week/month begins (there's nothing from it yet), while
// the annual total keeps growing all year since it's the same history,
// just filtered by the current year.
function startOfWeek(d){
  var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = date.getDay(); // 0 = domingo
  var diffToMonday = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diffToMonday);
  return date;
}

function isCompletedAppt(a, now){
  return a.done === true;
}

function formatBRL(n){
  return "R$ " + (Math.round((n || 0) * 100) / 100).toFixed(2).replace(".", ",");
}

function computeBarberStats(){
  var now = new Date();
  var weekStartKey = dateKey(startOfWeek(now));
  var monthKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
  var yearNum = now.getFullYear();

  var stats = {
    weekEarnings: 0, weekJobs: 0,
    monthEarnings: 0, monthJobs: 0,
    yearEarnings: 0, yearJobs: 0,
    year: yearNum
  };

  state.appts.forEach(function(a){
    if(!isCompletedAppt(a, now)) return;
    var price = a.price || 0;
    if(a.date >= weekStartKey){
      stats.weekEarnings += price;
      stats.weekJobs += 1;
    }
    if(a.date.slice(0, 7) === monthKey){
      stats.monthEarnings += price;
      stats.monthJobs += 1;
    }
    if(parseInt(a.date.slice(0, 4), 10) === yearNum){
      stats.yearEarnings += price;
      stats.yearJobs += 1;
    }
  });

  return stats;
}

}

    var waConfirmHtml = waConfirmLink
      ? '<a class="ghost" href="'+waConfirmLink+'" target="_blank" rel="noopener" style="display:inline-block; text-decoration:none; margin-top:12px;">Não abriu? Confirmar via WhatsApp</a>'

        '<h2 class="display">Horário confirmado</h2>'+

        waConfirmHtml+

        '<div><span class="backlink" id="logoutClient" style="margin-top:16px;">Sair da conta</span></div>'+

      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      render();
    };
    document.getElementById("logoutClient").onclick = doClientLogout;
    wireClientOwnApptsHandlers(el);
    return;
  }

  var services = state.config.services;
  var days = nextDays(10);

  var selectedSvc = services.find(function(s){ return s.id === state.clientSelectedService; });

  var svcHtml = services.map(function(s){
    var sel = state.clientSelectedService === s.id;
    return '<div class="svc'+(sel?' selected':'')+'" data-svc="'+s.id+'" aria-pressed="'+sel+'">'+
      '<div class="name">'+escapeHtml(s.name)+'</div>'+
      '<div class="meta">R$ '+s.price+' · '+s.minutes+' min</div>'+
    '</div>';
  }).join("");

  var daysHtml = days.map(function(d){
    var key = dateKey(d);
    var sel = state.clientSelectedDate === key;
    return '<div class="day'+(sel?' selected':'')+'" data-date="'+key+'" aria-pressed="'+sel+'" aria-label="'+DOW[d.getDay()]+' dia '+d.getDate()+'">'+
      '<div class="dow">'+DOW[d.getDay()]+'</div>'+
      '<div class="num">'+d.getDate()+'</div>'+
    '</div>';
  }).join("");

  var slotsHtml = '<p class="empty">Escolha um serviço para ver os horários</p>';
  if(selectedSvc && !state.clientSelectedDate){
    slotsHtml = '<p class="empty">Escolha um dia para ver os horários</p>';
  }
  if(selectedSvc && state.clientSelectedDate){
    var selDate = days.find(function(d){ return dateKey(d) === state.clientSelectedDate; });
    var slots = selDate ? slotsForDate(selDate, selectedSvc.minutes) : [];
    if(slots.length === 0){
      slotsHtml = '<p class="empty">Sem horários livres nesse dia pra esse serviço ('+selectedSvc.minutes+' min)</p>';
    } else {
      slotsHtml = '<div class="slots">' + slots.map(function(t){
        var taken = !isSlotAvailable(state.clientSelectedDate, t, selectedSvc.minutes);
        var sel = state.clientSelectedSlot === t;
        var extra = taken ? ' aria-disabled="true" aria-label="'+t+', indisponível"' : ' aria-pressed="'+sel+'" aria-label="'+t+'"';
        return '<div class="slot'+(taken?' taken':'')+(sel?' selected':'')+'" data-slot="'+(taken?'':t)+'"'+extra+'>'+t+'</div>';
      }).join("") + '</div>';
    }
  }

  el.innerHTML =
    renderSessionBarHtml()+
    renderClientOwnApptsHtml()+
    '<div class="card">'+
      '<h2>1. Escolha o serviço</h2>'+
      '<div class="services">'+svcHtml+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<h2>2. Escolha o dia</h2>'+
      '<div class="days">'+daysHtml+'</div>'+
      '<h2 style="margin-top:18px;">3. Escolha o horário</h2>'+
      slotsHtml+
    '</div>'+
    '<div class="card">'+
      '<div id="cliError" class="error" role="alert" aria-live="polite" style="display:none;"></div>'+
      '<button class="primary" id="confirmBtn">Confirmar agendamento</button>'+
    '</div>';

  wireSessionBarHandlers(el);
  wireClientOwnApptsHandlers(el);

  el.querySelectorAll(".svc").forEach(function(node){
    makeActivatable(node, function(){
      state.clientSelectedService = node.getAttribute("data-svc");
      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      render();
    });
  });
  el.querySelectorAll(".day").forEach(function(node){
    makeActivatable(node, async function(){
      state.clientSelectedDate = node.getAttribute("data-date");
      state.clientSelectedSlot = null;
      await refreshClientDateAppts(state.clientSelectedDate);
      render();
    });
  });
  el.querySelectorAll(".slot").forEach(function(node){
    var t = node.getAttribute("data-slot");
    if(!t){
      node.setAttribute("tabindex", "-1");
      return;
    }
    makeActivatable(node, function(){ state.clientSelectedSlot = t; render(); });
  });

  document.getElementById("confirmBtn").onclick = async function(){
    var errBox = document.getElementById("cliError");
    if(!state.clientSelectedService){
      errBox.textContent = "Escolha um serviço.";
      errBox.style.display = "block";
      return;
    }
    if(!state.clientSelectedDate || !state.clientSelectedSlot){
      errBox.textContent = "Escolha o dia e o horário.";
      errBox.style.display = "block";
      return;
    }
    errBox.style.display = "none";
    var btn = document.getElementById("confirmBtn");
    btn.disabled = true;
    btn.textContent = "Confirmando...";

    await refreshClientDateAppts(state.clientSelectedDate);
    var svc = state.config.services.find(function(s){ return s.id === state.clientSelectedService; });
    if(!isSlotAvailable(state.clientSelectedDate, state.clientSelectedSlot, svc.minutes)){
      errBox.textContent = "Esse horário acabou de ser reservado. Escolha outro.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Confirmar agendamento";
      render();
      return;
    }

    var appt = {
      date: state.clientSelectedDate,
      time: state.clientSelectedSlot,
      serviceId: svc.id,
      serviceName: svc.name,
      price: svc.price,
      minutes: svc.minutes,
      name: state.clientSession.name,
      phone: state.clientSession.phone,
      uid: state.clientSession.uid,
      done: false,
      createdAt: Date.now()
    };

    // A checagem acima é só pra UX (evitar mostrar "confirmando" num
    // horário já óbvio como ocupado). A trava real contra dois clientes
    // confirmando o mesmo horário ao mesmo tempo é a transação abaixo.
    var newApptId;
    try{
      newApptId = await bookAppointmentTx(appt);
    }catch(e){
      if(e && e.message === "SLOT_TAKEN"){
        errBox.textContent = "Esse horário acabou de ser reservado por outra pessoa. Escolha outro.";
      } else {
        errBox.textContent = saveErrorMessage();
      }
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Confirmar agendamento";
      await refreshClientDateAppts(state.clientSelectedDate);
      render();
      return;
    }

    var days2 = nextDays(10);
    var d = days2.find(function(dd){ return dateKey(dd) === appt.date; });
    state.clientConfirmed = {
      serviceName: svc.name,
      dateLabel: DOW[d.getDay()] + " " + d.getDate() + "/" + pad(d.getMonth()+1),
      time: appt.time
    };
    state.clientOwnAppts.push(Object.assign({id: newApptId}, appt));
    // Abre o WhatsApp automaticamente com a confirmação já preenchida. Como
    // isso ainda acontece dentro do mesmo clique do usuário (só depois de
    // um await), a maioria dos navegadores permite o popup sem bloquear;
    // o botão na tela de sucesso continua ali como alternativa caso algum
    // navegador bloqueie mesmo assim.
    if(state.config.whatsapp){
      var waLinkUrl = waLink(state.config.whatsapp, buildBookingWaMessage(state.clientConfirmed));
      if(waLinkUrl) window.open(waLinkUrl, "_blank", "noopener");
    }
    render();
  };
}

    '<div class="card">'+
      '<h2>Acesso do barbeiro</h2>'+
      '<p class="sub">Área restrita — só você vê os agendamentos aqui.</p>'+
      '<label for="pinInput">PIN de acesso</label>'+
      '<input type="password" id="pinInput" placeholder="****" inputmode="numeric" autocomplete="off">'+
      '<div id="pinError" class="error" role="alert" aria-live="polite" style="display:none;">PIN incorreto.</div>'+
      '<button class="primary" id="pinBtn">Entrar</button>'+
    '</div>';
  var backHandler2 = function(){ state.screen = "landing"; render(); };
  document.getElementById("backLink").setAttribute("tabindex", "0");
  document.getElementById("backLink").setAttribute("role", "button");
  document.getElementById("backLink").onclick = backHandler2;
  document.getElementById("backLink").onkeydown = function(ev){
    if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); backHandler2(); }
  };
  var pinInput = document.getElementById("pinInput");
  async function tryPin(){
    var val = pinInput.value.trim();
    var errBox = document.getElementById("pinError");
    var btn = document.getElementById("pinBtn");
    if(!val){
      pinInput.classList.add("invalid");
      errBox.textContent = "Informe o PIN.";
      errBox.style.display = "block";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Verificando...";
    try{
      // Sessão anônima só pra satisfazer as regras do Firestore (que
      // exigem um usuário autenticado pra ler barberConfig). A trava real
      // é a comparação do PIN abaixo, feita depois da leitura.
      if(!auth.currentUser){ await signInAnonymously(auth); }
      var cfgSnap = await getDoc(doc(db, "barberConfig", "main"));
      var savedPin = cfgSnap.exists() ? cfgSnap.data().pin : null;
      if(savedPin && val === String(savedPin)){
        state.barberLoggedIn = true;
        state.screen = "barberApp";
        render();
        refreshAppts().then(render);
      } else {
        btn.disabled = false;
        btn.textContent = "Entrar";
        pinInput.classList.add("invalid");
        errBox.textContent = "PIN incorreto.";
        errBox.style.display = "block";
      }
    }catch(e){
      btn.disabled = false;
      btn.textContent = "Entrar";
      errBox.textContent = "Não foi possível verificar o PIN. Verifique sua conexão.";
      errBox.style.display = "block";
    }
  }
  document.getElementById("pinBtn").onclick = tryPin;
  pinInput.addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); tryPin(); }
    pinInput.classList.remove("invalid");
  });
}

// ---------- BARBER APP ----------

function renderBarberApp(el){
  var todayKey = dateKey(new Date());
  var upcoming = state.appts
    .filter(function(a){ return a.date >= todayKey || !a.done; })
    .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });

  var apptsHtml = '<p class="empty">Nenhum agendamento por enquanto.</p>';
  if(upcoming.length){
    apptsHtml = upcoming.map(function(a){
      var dur = a.minutes || state.config.slotMinutes;
      var actionsHtml = a.done
        ? '<span class="done-badge">&#10003; Realizado</span><button class="ghost" data-undone="'+a.id+'">Desfazer</button>'
        : '<button class="success" data-done="'+a.id+'">Realizado</button><button class="danger" data-cancel="'+a.id+'">Cancelar</button>';
      return '<div class="appt'+(a.done ? ' done' : '')+'">'+
        '<div>'+
          '<div class="who">'+escapeHtml(a.name)+' · '+escapeHtml(a.serviceName)+' ('+dur+' min)</div>'+
          '<div class="when">'+a.date.split("-").reverse().join("/")+' às '+a.time+' · '+escapeHtml(a.phone)+'</div>'+
        '</div>'+
        '<div class="appt-actions">'+actionsHtml+'</div>'+
      '</div>';
    }).join("");
  }

  var weekdayToggle = DOW.map(function(name, idx){
    var on = state.config.workDays.indexOf(idx) !== -1;
    return '<span class="'+(on?'on':'')+'" data-day="'+idx+'" aria-pressed="'+on+'">'+name+'</span>';
  }).join("");

  var stats = computeBarberStats();
  var statsHtml =
    '<div class="card">'+
      '<h2>Seu desempenho</h2>'+
      '<p class="sub">Considera só os agendamentos marcados como "realizado".</p>'+
      '<div class="stats-grid">'+
        '<div class="stat-box"><div class="stat-label">Saldo da semana</div><div class="stat-value money">'+formatBRL(stats.weekEarnings)+'</div></div>'+
        '<div class="stat-box"><div class="stat-label">Trabalhos da semana</div><div class="stat-value">'+stats.weekJobs+'</div></div>'+
        '<div class="stat-box"><div class="stat-label">Saldo do mês</div><div class="stat-value money">'+formatBRL(stats.monthEarnings)+'</div></div>'+
        '<div class="stat-box"><div class="stat-label">Trabalhos do mês</div><div class="stat-value">'+stats.monthJobs+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<h2>Perfil</h2>'+
      '<p class="sub">Acumulado do ano de '+stats.year+'.</p>'+
      '<div class="stats-grid">'+
        '<div class="stat-box"><div class="stat-label">Saldo anual</div><div class="stat-value money">'+formatBRL(stats.yearEarnings)+'</div></div>'+
        '<div class="stat-box"><div class="stat-label">Trabalhos no ano</div><div class="stat-value">'+stats.yearJobs+'</div></div>'+
      '</div>'+
    '</div>';

  el.innerHTML =
    '<span class="backlink" id="logoutBarber">&larr; sair do painel</span>'+
    statsHtml+
    '<div class="card">'+
      '<div class="appts-head">'+
        '<h2>Agendamentos</h2>'+
        '<button class="ghost" id="refreshApptsBtn">Atualizar</button>'+
      '</div>'+
      '<p class="sub">Painel só visível pra você.</p>'+
      apptsHtml+
    '</div>'+
    '<div class="card">'+
      '<h2>Configurações</h2>'+
      '<p class="sub">Dias e horários de atendimento</p>'+
      '<label>Dias que atende</label>'+
      '<div class="weekday-toggle">'+weekdayToggle+'</div>'+
      '<div class="grid2">'+
        '<div><label for="startHour">Abre às (hora)</label><input type="text" id="startHour" value="'+state.config.startHour+'"></div>'+
        '<div><label for="endHour">Fecha às (hora)</label><input type="text" id="endHour" value="'+state.config.endHour+'"></div>'+
      '</div>'+
      '<label for="slotMin">Duração do intervalo de horários (min)</label>'+
      '<input type="text" id="slotMin" value="'+state.config.slotMinutes+'">'+
      '<label for="newPin">PIN de acesso</label>'+
      '<input type="password" id="newPin" value="'+escapeHtml(state.config.pin)+'">'+
      '<label for="barberWhatsapp">WhatsApp para receber confirmações e cancelamentos</label>'+
      '<input type="tel" id="barberWhatsapp" placeholder="(11) 91234-5678" value="'+escapeHtml(state.config.whatsapp || "")+'">'+
      '<button class="primary" id="saveCfgBtn">Salvar configurações</button>'+
      '<div id="cfgSaved" class="hint" role="status" aria-live="polite" style="display:none;">Configurações salvas.</div>'+
    '</div>'+
    '<div class="card">'+
      '<h2>Serviços</h2>'+
      '<div id="servicesList"></div>'+
      '<button class="ghost" id="addSvcBtn" style="margin-top:10px;">+ Adicionar serviço</button>'+
    '</div>';

  attachPhoneMask(document.getElementById("barberWhatsapp"));

  var logoutHandler = async function(){
    try{ await signOut(auth); }catch(e){}
    state.barberLoggedIn = false;
    state.screen = "landing";
    render();
  };
  var logoutBtn = document.getElementById("logoutBarber");
  logoutBtn.setAttribute("tabindex", "0");
  logoutBtn.setAttribute("role", "button");
  logoutBtn.onclick = logoutHandler;
  logoutBtn.onkeydown = function(ev){
    if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); logoutHandler(); }
  };

  document.getElementById("refreshApptsBtn").onclick = async function(){
    var btn = document.getElementById("refreshApptsBtn");
    btn.disabled = true;
    btn.textContent = "Atualizando...";
    await refreshAppts();
    render();
  };

  el.querySelectorAll("[data-cancel]").forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-cancel");
      var ok = window.confirm("Cancelar esse agendamento?");
      if(!ok) return;
      var previous = state.appts;
      state.appts = state.appts.filter(function(a){ return a.id !== id; });
      render();
      var okSave = await cancelApptDoc(id);
      if(!okSave){
        state.appts = previous;
        showToast(saveErrorMessage(), true);
        render();
        return;
      }
    };
  });

  el.querySelectorAll("[data-done]").forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-done");
      var target = state.appts.find(function(a){ return a.id === id; });
      if(!target) return;
      target.done = true;
      render();
      var ok = await setApptDoneDoc(id, true);
      if(!ok){
        target.done = false;
        showToast(saveErrorMessage(), true);
        render();
        return;
      }
    };
  });

  el.querySelectorAll("[data-undone]").forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-undone");
      var target = state.appts.find(function(a){ return a.id === id; });
      if(!target) return;
      target.done = false;
      render();
      var ok = await setApptDoneDoc(id, false);
      if(!ok){
        target.done = true;
        showToast(saveErrorMessage(), true);
        render();
        return;
      }
    };
  });

  el.querySelectorAll(".weekday-toggle span").forEach(function(node){
    makeActivatable(node, function(){
      var day = parseInt(node.getAttribute("data-day"), 10);
      var idx = state.config.workDays.indexOf(day);
      if(idx === -1){ state.config.workDays.push(day); } else { state.config.workDays.splice(idx, 1); }
      render();
    });
  });

  document.getElementById("saveCfgBtn").onclick = async function(){
    var sh = parseInt(document.getElementById("startHour").value, 10);
    var eh = parseInt(document.getElementById("endHour").value, 10);
    var sm = parseInt(document.getElementById("slotMin").value, 10);
    var pin = document.getElementById("newPin").value.trim().slice(0, 12);
    var whatsapp = document.getElementById("barberWhatsapp").value.trim();
    var saved = document.getElementById("cfgSaved");
    var invalid =
      isNaN(sh) || isNaN(eh) || isNaN(sm) ||
      sh < 0 || sh > 23 || eh < 1 || eh > 24 || sh >= eh ||
      sm <= 0 || sm > 240;
    if(invalid){
      saved.textContent = "Confira os valores de horário (0-23h, duração de 1 a 240 min).";
      saved.style.display = "block";
      return;
    }
    if(pin.length < 4){
      saved.textContent = "O PIN precisa ter pelo menos 4 caracteres.";
      saved.style.display = "block";
      return;
    }
    // WhatsApp é opcional (sem ele, o botão de confirmação/cancelamento via
    // WhatsApp simplesmente não aparece pro cliente), mas se preenchido
    // precisa ser um número válido com DDD.
    if(whatsapp && !isValidPhone(whatsapp)){
      saved.textContent = "Informe um WhatsApp válido, com DDD, ou deixe o campo em branco.";
      saved.style.display = "block";
      return;
    }
    var previous = {startHour: state.config.startHour, endHour: state.config.endHour, slotMinutes: state.config.slotMinutes, pin: state.config.pin, whatsapp: state.config.whatsapp};
    state.config.startHour = sh;
    state.config.endHour = eh;
    state.config.slotMinutes = sm;
    state.config.pin = pin;
    state.config.whatsapp = whatsapp;
    var ok = await saveConfig();
    if(!ok){
      state.config.startHour = previous.startHour;
      state.config.endHour = previous.endHour;
      state.config.slotMinutes = previous.slotMinutes;
      state.config.pin = previous.pin;
      state.config.whatsapp = previous.whatsapp;
      saved.textContent = saveErrorMessage();
      saved.style.display = "block";
      return;
    }
    saved.textContent = "Configurações salvas.";
    saved.style.display = "block";
  };

  renderServicesList();

  document.getElementById("addSvcBtn").onclick = async function(){
    state.config.services.push({id:"s"+Date.now(), name:"Novo serviço", price:0, minutes:30});
    var ok = await saveConfig();
    if(!ok){
      state.config.services.pop();
      showToast(saveErrorMessage(), true);
      return;
    }
    render();
  };
}

function renderServicesList(){
  var box = document.getElementById("servicesList");
  if(!box) return;
  box.innerHTML = state.config.services.map(function(s, i){
    return '<div class="grid2" style="align-items:end; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:10px;">'+
      '<div><label>Nome</label><input type="text" data-field="name" data-idx="'+i+'" value="'+escapeHtml(s.name)+'"></div>'+
      '<div style="display:flex; gap:8px;">'+
        '<div style="flex:1;"><label>Preço (R$)</label><input type="text" data-field="price" data-idx="'+i+'" value="'+s.price+'"></div>'+
        '<div style="flex:1;"><label>Min.</label><input type="text" data-field="minutes" data-idx="'+i+'" value="'+s.minutes+'"></div>'+
      '</div>'+
      '<button class="danger" data-removesvc="'+i+'" style="grid-column:1/-1; width:fit-content;">Remover</button>'+
    '</div>';
  }).join("");

  box.querySelectorAll("input").forEach(function(inp){
    inp.onchange = async function(){
      var idx = parseInt(inp.getAttribute("data-idx"), 10);
      var field = inp.getAttribute("data-field");
      var val = inp.value;
      var previous = state.config.services[idx][field];
      if(field === "name"){
        val = val.trim().slice(0, 40);
        if(!val) val = "Serviço";
      } else if(field === "price"){
        val = parseFloat(val);
        if(isNaN(val) || val < 0) val = 0;
        val = Math.min(Math.round(val * 100) / 100, 9999);
      } else if(field === "minutes"){
        val = parseInt(val, 10);
        if(isNaN(val) || val <= 0) val = state.config.slotMinutes;
        val = Math.min(val, 480);
      }
      state.config.services[idx][field] = val;
      inp.value = val;
      var ok = await saveConfig();
      if(!ok){
        state.config.services[idx][field] = previous;
        inp.value = previous;
        showToast(saveErrorMessage(), true);
      }
    };
  });
  box.querySelectorAll("[data-removesvc]").forEach(function(btn){
    btn.onclick = async function(){
      var idx = parseInt(btn.getAttribute("data-removesvc"), 10);
      var removed = state.config.services.splice(idx, 1)[0];
      var ok = await saveConfig();
      if(!ok){
        state.config.services.splice(idx, 0, removed);
        showToast(saveErrorMessage(), true);
        return;
      }
      render();
    };
  });
}

async function init(){
  render();
  await loadData();

  // Restaura a sessão do cliente se o navegador ainda tiver um login
  // Google válido (Firebase mantém isso entre recarregamentos de página).
  // Sessão do barbeiro (anônima) nunca é restaurada automaticamente —
  // ele sempre precisa digitar o PIN de novo, que é a trava real.
  var restoreResolved = false;
  onAuthStateChanged(auth, async function(user){
    if(restoreResolved) return; // só usa a primeira notificação, na carga inicial
    restoreResolved = true;
    if(user && user.providerData.some(function(p){ return p.providerId === "google.com"; })){
      try{
        var profileSnap = await getDoc(doc(db, "clients", user.uid));
        if(profileSnap.exists() && profileSnap.data().phone){
          var p = profileSnap.data();
          state.clientSession = {uid: user.uid, name: p.name || user.displayName, phone: p.phone, email: p.email || user.email};
          state.screen = "clientApp";
          render();
          refreshClientOwnAppts().then(render);
        }
      }catch(e){}
    }
  });

  render();

  // While the barber panel is open, quietly re-check storage for new
  // bookings every few seconds so the barber doesn't have to manually
  // refresh or reopen the page to see appointments made elsewhere.
  // Skipped while a form field is focused so it never interrupts typing.
  setInterval(async function(){
    if(state.screen !== "barberApp") return;
    var active = document.activeElement;
    var isTyping = active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
    if(isTyping) return;
    var before = JSON.stringify(state.appts);
    await refreshAppts();
    if(JSON.stringify(state.appts) !== before){ render(); }
  }, 12000);
}
init();

})();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B31 — Agendamento</title>
<style>
  :root{
    --black:#0A0A0A;
    --dark:#1C1C1C;
    --gray-700:#3D3D3D;
    --gray-500:#6E6E6E;
    --gray-300:#B8B8B8;
    --gray-100:#E8E8E8;
    --white:#FFFFFF;
    --line:#DADADA;
    --gold:#C9A227;
    --gold-dark:#9C7D1F;
    --gold-soft:#F1E4B8;
    --page-bg:#F5F4F1;
    --barber-red:#C1272D;
    --barber-blue:#1D4E89;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--black);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
  }
  .display{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-weight:700;
    letter-spacing:0.02em;
  }
  [role="button"]{ cursor:pointer; }
  [role="button"]:focus-visible,
  button:focus-visible,
  .backlink:focus-visible,
  a:focus-visible{
    outline:2px solid var(--black);
    outline-offset:2px;
  }
  .sr-only{
    position:absolute;
    width:1px; height:1px;
    padding:0; margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  .field-error{
    color:var(--black);
    font-size:12px;
    font-weight:600;
    margin-top:4px;
    display:none;
  }
  .field-error.show{ display:block; }
  input.invalid{
    border-color:var(--black);
    border-width:2px;
  }
  main{
    max-width:920px;
    margin:0 auto;
    padding:24px 24px 60px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(10,10,10,0.05);
  }
  .card h2{
    margin:0 0 4px;
    padding-bottom:9px;
    font-size:18px;
    position:relative;
  }
  .card h2::after{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:26px; height:3px;
    border-radius:2px;
    background:var(--gold);
  }
  .appts-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .appts-head h2{ flex:1; }
  .appts-head .ghost{ flex-shrink:0; }
  .card .sub{
    margin:0 0 16px;
    font-size:13px;
    color:var(--gray-500);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin:14px 0 6px;
    color:var(--black);
  }
  input[type=text], input[type=tel], input[type=password], select{
    width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:14px;
    background:var(--white);
    color:var(--black);
  }
  textarea{
    width:100%;
    padding:10px 12px;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:14px;
    font-family:inherit;
    background:var(--white);
    color:var(--black);
    resize:vertical;
  }
  textarea:focus{
    outline:2px solid var(--black);
    outline-offset:1px;
  }
  input:focus, select:focus{
    outline:2px solid var(--black);
    outline-offset:1px;
  }
  .services{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:10px;
    margin-top:6px;
  }
  .svc{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px;
    cursor:pointer;
    background:var(--white);
  }
  .svc.selected{
    border-color:var(--gold-dark);
    background:var(--gold-soft);
  }
  .svc .name{font-weight:600; font-size:14px;}
  .svc .meta{font-size:12px; color:var(--gray-500); margin-top:2px;}
  .days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-top:6px;
  }
  .day{
    min-width:64px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 6px;
    cursor:pointer;
    background:var(--white);
    font-size:12px;
  }
  .day .dow{color:var(--gray-500); text-transform:uppercase; font-size:10px;}
  .day .num{font-weight:700; font-size:16px;}
  .day.selected{
    border-color:var(--gold);
    background:var(--black);
    color:var(--white);
  }
  .day.selected .dow{color:var(--gray-300);}
  .slots{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(72px,1fr));
    gap:8px;
    margin-top:6px;
  }
  .slot{
    padding:8px 4px;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    cursor:pointer;
  }
  .slot.selected{
    background:var(--black);
    border-color:var(--gold);
    color:var(--white);
    font-weight:600;
  }
  .slot.taken{
    color:var(--gray-300);
    text-decoration:line-through;
    cursor:not-allowed;
    background:var(--gray-100);
  }
  button.primary{
    background:var(--black);
    color:var(--white);
    border:none;
    padding:12px 18px;
    border-radius:6px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:18px;
  }
  button.primary:hover{
    background:var(--dark);
    box-shadow:0 4px 14px rgba(201,162,39,0.28);
  }
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
    color:var(--black);
  }
  button.danger{
    background:transparent;
    border:1px solid var(--black);
    color:var(--black);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }
  button.success{
    background:var(--black);
    border:1px solid var(--black);
    color:var(--white);
    padding:6px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  button.success:hover{
    background:var(--dark);
  }
  .appt-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .appt.done{
    background:var(--gray-100);
    opacity:0.75;
  }
  .done-badge{
    font-size:12px;
    font-weight:700;
    color:var(--black);
    background:transparent;
    border:1px solid var(--gold);
    padding:5px 10px;
    border-radius:6px;
  }
  .app-toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--black);
    color:var(--white);
    padding:12px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.25);
    z-index:1000;
    max-width:90%;
    text-align:center;
  }
  .app-toast.error{
    background:var(--barber-red);
  }
  .env-banner{
    background:var(--barber-red);
    color:var(--white);
    text-align:center;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
  }
  .error{
    color:var(--black);
    font-weight:600;
    font-size:13px;
    margin-top:6px;
  }
  .success-box{
    text-align:center;
    padding:30px 16px;
  }
  .success-box .badge{
    width:52px;height:52px;border-radius:50%;
    background:var(--black);color:var(--white);
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;font-size:26px;font-weight:700;
  }
  .appt{
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
    gap:10px;
    flex-wrap:wrap;
  }
  .appt .who{font-weight:600; font-size:14px;}
  .appt .when{font-size:13px; color:var(--gray-500);}
  .next-appt{
    border:1px solid var(--gold-dark);
    background:var(--gold-soft);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .next-appt-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--gold-dark);
    margin-bottom:4px;
  }
  .next-appt-body{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    font-size:14px;
  }
  .next-appt-when{
    font-size:13px;
    font-weight:700;
    color:var(--black);
    white-space:nowrap;
  }
  .appt-day-group{ margin-bottom:4px; }
  .appt-day-header{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--gray-500);
    margin:16px 0 8px;
  }
  .appt-day-group:first-child .appt-day-header{ margin-top:0; }
  .appt-day-header.is-overdue{ color:var(--barber-red); }
  .empty{
    color:var(--gray-500);
    font-size:13px;
    text-align:center;
    padding:20px 0;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .weekday-toggle{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .weekday-toggle span{
    padding:6px 10px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    border-radius:6px;
    border:1px solid var(--line);
    font-size:12px;
    cursor:pointer;
    background:var(--white);
  }
  .weekday-toggle span.on{
    background:var(--black);
    color:var(--white);
    border-color:var(--gold);
  }
  .link-box{
    background:var(--gray-100);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:12px;
    color:var(--gray-500);
    margin-top:10px;
  }
  .hint{font-size:12px; color:var(--gray-500); margin-top:4px;}

  /* Landing */
  .landing-wrap{
    padding:0 0 10px;
    text-align:center;
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .landing-hero{
    background:var(--black);
    color:var(--white);
    margin:-24px -24px 26px;
    padding:44px 24px 36px;
    border-radius:0 0 18px 18px;
    border-bottom:3px solid var(--gold);
    position:relative;
    overflow:hidden;
  }
  .landing-hero::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,0.045) 0 12px,
      transparent 12px 24px
    );
    pointer-events:none;
  }
  .landing-hero .lead{
    position:relative;
    font-size:13px;
    color:var(--gray-300);
    max-width:280px;
    margin:14px auto 0;
  }
  .landing-subtitle{
    text-align:left;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--gray-500);
    margin:0 0 10px;
  }
  .landing-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:0;
    text-align:left;
  }
  @media (max-width:560px){ .landing-grid{grid-template-columns:1fr;} }
  .landing-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:24px 20px;
    cursor:pointer;
    background:var(--white);
    text-align:left;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    animation: fadeUp .4s ease both;
    animation-delay:.05s;
  }
  .landing-grid .landing-card:first-child{ animation-delay:0s; }
  .landing-card:hover{
    border-color:var(--gold-dark);
    transform:translateY(-3px);
    box-shadow:0 12px 26px rgba(201,162,39,0.16);
  }
  .landing-card .icon{
    width:40px;height:40px;
    border:1px solid var(--black);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
    color:var(--black);
  }
  .landing-card h3{
    margin:0 0 6px;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .landing-card h3 .arrow{
    opacity:0;
    transform:translateX(-4px);
    transition:all .15s ease;
    font-size:14px;
    color:var(--gray-500);
  }
  .landing-card:hover h3 .arrow{ opacity:1; transform:translateX(0); }
  .landing-card p{margin:0; font-size:13px; color:var(--gray-500);}
  .staff-note{
    text-align:center;
    margin-top:20px;
    font-size:11px;
    color:var(--gray-300);
  }
  .backlink{
    display:inline-block;
    margin-bottom:14px;
    font-size:13px;
    color:var(--gray-500);
    cursor:pointer;
  }
  .backlink:hover{ color:var(--gold-dark); }
  .authtabs{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  .authtabs button{
    flex:1;
    padding:9px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .authtabs button.active{
    background:var(--black);
    color:var(--white);
    border-color:var(--gold);
  }
  .session-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .session-bar .who{font-size:13px; color:var(--gray-500);}

  /* Auth logo */
  .auth-logo{
    text-align:center;
    margin-bottom:24px;
  }
  .auth-logo .logo-img{
    width:132px;
    height:auto;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.22);
  }
  .auth-logo.on-dark .logo-img{
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .auth-logo .mini-stripe{
    width:72px;
    height:6px;
    margin:12px auto 0;
    border-radius:3px;
    border:1px solid rgba(0,0,0,0.15);
    background: repeating-linear-gradient(
      -45deg,
      var(--barber-red) 0 8px,
      var(--white) 8px 16px,
      var(--barber-blue) 16px 24px,
      var(--white) 24px 32px
    );
  }
  .auth-logo.on-dark{ position:relative; }
  .auth-logo.on-dark .mini-stripe{
    border-color:rgba(255,255,255,0.35);
  }

  /* Barber stats */
  .stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
  }
  @media (max-width:480px){ .stats-grid{grid-template-columns:1fr;} }
  .stat-box{
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    background:var(--gray-100);
  }
  .stat-label{
    font-size:12px;
    color:var(--gray-500);
    margin-bottom:4px;
  }
  .stat-value{
    font-size:22px;
    font-weight:700;
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  }
  .stat-value.money{ color:var(--gold-dark); }

  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:6px 0 10px;
  }
  .cal-head .cal-title{
    font-weight:700;
    font-size:15px;
    text-transform:capitalize;
  }
  .cal-nav{
    display:flex;
    gap:6px;
  }
  .cal-nav button{
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    width:30px;
    height:30px;
    font-size:14px;
    cursor:pointer;
  }
  .cal-dow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:4px;
  }
  .cal-dow span{
    text-align:center;
    font-size:11px;
    color:var(--gray-500);
    text-transform:uppercase;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
  }
  .cal-day{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--white);
    font-size:12px;
    cursor:pointer;
    position:relative;
    min-height:40px;
  }
  .cal-day.cal-empty{
    border:none;
    background:transparent;
    cursor:default;
  }
  .cal-day .cal-num{ font-weight:600; }
  .cal-day.is-today{ border-color:var(--gold-dark); border-width:2px; }
  .cal-day.is-past{ color:var(--gray-300); background:var(--gray-100); }
  .cal-day.is-off{ background:var(--gray-100); color:var(--gray-500); }
  .cal-day.is-closed{ background:var(--gray-100); text-decoration:line-through; color:var(--gray-500); }
  .cal-day.is-locked{ opacity:0.45; }
  .cal-day.has-appts{ border-color:var(--gold); }
  .cal-day.is-selected{ background:var(--black); color:var(--white); border-color:var(--gold); }
  .cal-day .cal-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--gold-dark);
  }
  .cal-day.is-selected .cal-dot{ background:var(--gold); }
  .cal-legend{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:10px;
    font-size:11px;
    color:var(--gray-500);
  }
  .cal-legend span{ display:flex; align-items:center; gap:5px; }
  .cal-legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }

  /* Calendário do cliente: mesma base do calendário do barbeiro (.cal-*),
     com um pouco mais de acabamento visual e um container que se comporta
     bem tanto num card estreito de celular quanto num card largo de
     desktop (sem esticar os dias até ficarem enormes). */
  .cal-wrap{
    max-width:360px;
    margin:10px auto 0;
  }
  .cal-day{
    transition:border-color .15s ease, background-color .15s ease, transform .1s ease;
  }
  .cal-day.is-available{
    border-color:var(--line);
    box-shadow:0 1px 2px rgba(10,10,10,0.04);
  }
  .cal-day.is-available:hover{
    border-color:var(--gold-dark);
    background:var(--gold-soft);
  }
  .cal-day.is-available:active{ transform:scale(0.96); }
  .cal-day.is-selected.is-available:hover{
    background:var(--dark);
    border-color:var(--gold);
  }
  .cal-day.is-past,
  .cal-day.is-off,
  .cal-day.is-closed,
  .cal-day.is-locked{
    cursor:default;
  }
  .cal-nav button:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .cal-nav button:not(:disabled):hover{
    border-color:var(--gold-dark);
    background:var(--gold-soft);
  }
  @media (min-width:640px){
    .cal-wrap{ max-width:400px; }
    .cal-day{ font-size:13px; }
    .cal-day .cal-num{ font-size:14px; }
  }
  .day-editor{
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .day-editor .day-appt-row{
    font-size:13px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
  }
  .month-unlock-box{
    margin-top:10px;
    padding:12px;
    border:1px dashed var(--line);
    border-radius:6px;
    font-size:13px;
  }
  .client-row{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .client-row .who{ font-weight:600; font-size:14px; }
  .client-row .client-meta{ font-size:12px; color:var(--gray-500); margin-top:2px; }

  /* Etapa "Serviço" recolhida (depois de escolhida) */
  .step-summary-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  /* Resumo do agendamento antes de confirmar */
  .booking-summary{
    background:var(--page-bg);
    border:1px solid var(--gold-soft);
    border-left:3px solid var(--gold);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .booking-summary div{ display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .booking-summary .label{ color:var(--gray-500); }
  .booking-summary .value{ font-weight:700; text-align:right; }

  /* Indicador de progresso do agendamento (1 → 2 → 3) */
  .step-progress{
    display:flex;
    align-items:flex-start;
    margin:2px 0 18px;
  }
  .step-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    flex:0 0 60px;
    width:60px;
  }
  .step-circle{
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    border:2px solid var(--gray-300);
    color:var(--gray-500);
    background:var(--white);
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .step-node.done .step-circle{
    background:var(--gold);
    border-color:var(--gold-dark);
    color:var(--black);
  }
  .step-node.current .step-circle{
    border-color:var(--black);
    color:var(--black);
    background:var(--gold-soft);
  }
  .step-label{
    font-size:10px;
    color:var(--gray-500);
    text-align:center;
    line-height:1.2;
  }
  .step-node.current .step-label{ color:var(--black); font-weight:700; }
  .step-node.done .step-label{ color:var(--gray-700); }
  .step-line{
    flex:1 1 auto;
    height:2px;
    background:var(--gray-300);
    margin-top:13px;
  }

  /* Alternância "Marcar novo horário" / "Seus agendamentos" */
  .view-toggle{
    display:flex;
    gap:4px;
    background:var(--gray-100);
    padding:4px;
    border-radius:9px;
    margin:14px 0;
  }
  .view-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 8px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--gray-500);
    transition:background-color .15s ease, color .15s ease;
  }
  .view-toggle button.active{
    background:var(--black);
    color:var(--white);
  }
  .view-toggle button:not(.active):hover{
    background:var(--gold-soft);
    color:var(--black);
  }

  /* Link discreto de "reportar problema", quando o card completo está
     recolhido — evita competir visualmente com o fluxo principal. */
  .bug-teaser{
    text-align:center;
    margin:6px 0 22px;
    font-size:13px;
  }

  /* Link discreto pra abrir a política de privacidade */
  .privacy-link{
    text-align:center;
    margin:6px 0 18px;
    font-size:12px;
    color:var(--gray-500);
  }
  .privacy-link .backlink{ font-size:12px; }

  /* Modal da política de privacidade — usado em qualquer tela, por isso
     fica fora do fluxo normal de #app (ver div fixa no body). */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:1000;
    padding:0;
  }
  .modal-card{
    background:var(--white);
    width:100%;
    max-width:640px;
    max-height:85vh;
    overflow-y:auto;
    border-radius:14px 14px 0 0;
    padding:20px 20px 26px;
    box-shadow:0 -4px 24px rgba(0,0,0,0.25);
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    position:sticky;
    top:-20px;
    background:var(--white);
    padding-top:4px;
    margin-bottom:6px;
  }
  .modal-body{ font-size:13px; line-height:1.55; color:var(--gray-700); }
  .modal-body h3{ font-size:14px; color:var(--black); margin:16px 0 4px; }
  .modal-body p{ margin:0 0 10px; }
  .modal-body ul{ margin:0 0 10px; padding-left:18px; }
  @media (min-width:640px){
    .modal-backdrop{ align-items:center; }
    .modal-card{ border-radius:14px; }
    .modal-head{ top:-20px; }
  }

  /* Abas do painel do barbeiro */
  .barber-tabs{
    display:flex;
    gap:4px;
    background:var(--gray-100);
    padding:4px;
    border-radius:9px;
    margin-bottom:16px;
    overflow-x:auto;
  }
  .barber-tabs button{
    flex:1;
    white-space:nowrap;
    border:none;
    background:transparent;
    padding:10px 10px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--gray-500);
    transition:background-color .15s ease, color .15s ease;
  }
  .barber-tabs button.active{
    background:var(--black);
    color:var(--white);
  }
  .barber-tabs button:not(.active):hover{
    background:var(--gold-soft);
    color:var(--black);
  }
  .next-appt-card{
    border:1px solid var(--gold-dark);
    background:linear-gradient(180deg, var(--gold-soft), var(--white) 65%);
  }
</style>
</head>

function randomHex(byteLen){
  var arr = new Uint8Array(byteLen);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
}

async function sha256Hex(text){
  var enc = new TextEncoder().encode(text);
  var digestBuf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(digestBuf)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");

// não senha.
var PIN_HASH_ALGO = "pbkdf2-sha256-120k";
var PIN_HASH_ITERATIONS = 120000;

async function hashPin(pin, salt){
  var enc = new TextEncoder();
  var keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(pin), {name: "PBKDF2"}, false, ["deriveBits"]

  var bits = await crypto.subtle.deriveBits(
    {name: "PBKDF2", salt: enc.encode(salt), iterations: PIN_HASH_ITERATIONS, hash: "SHA-256"},

  return Array.from(new Uint8Array(bits)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
}

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
// Caminho inverso de dateKey: transforma "AAAA-MM-DD" de volta num Date
// local, usado quando o dia escolhido no calendário do cliente não está
// necessariamente numa lista de dias já montada em memória.
function dateFromKey(k){
  var p = k.split("-");
  return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}
// Formata "AAAA-MM-DD" como "Seg 14/09", reaproveitado no resumo do
// agendamento e na tela de confirmação.
function formatDateLabel(k){
  var d = dateFromKey(k);
  return DOW[d.getDay()] + " " + d.getDate() + "/" + pad(d.getMonth()+1);
}

// A barbearia funciona sempre no horário de Brasília (America/Sao_Paulo),
// não importa de onde o cliente esteja acessando. Sem isso, os cálculos de
// "hoje" e "que horas são agora" usariam o fuso do dispositivo de quem
// estiver com o app aberto — um cliente acessando de outro fuso (ou com o
// relógio do celular fora de hora) veria dias e horários errados.
//
// Isso corrige o FUSO HORÁRIO (o app sempre calcula como se estivesse em
// São Paulo, seja qual for o fuso do navegador). Não corrige um relógio do
// aparelho genuinamente errado (ex: alguém que mexeu manualmente na data do
// celular) — isso exigiria consultar um relógio de servidor, o que precisa
// de mais infraestrutura do que só HTML+Firestore.
function nowSP(){
  var parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Sao_Paulo",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());
  var map = {};
  parts.forEach(function(p){ if(p.type !== "literal") map[p.type] = p.value; });
  // Monta um Date "local" com os componentes de horário de SP, pra que
  // getDay()/getHours()/getDate() etc. já leiam certo em qualquer lugar
  // do código sem precisar mexer em cada função que usa esses métodos.
  return new Date(
    parseInt(map.year, 10), parseInt(map.month, 10) - 1, parseInt(map.day, 10),
    parseInt(map.hour, 10), parseInt(map.minute, 10), parseInt(map.second, 10)
  );
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function onlyDigits(s){ return String(s || "").replace(/\D/g, ""); }

function formatPhoneInput(value){
  var d = onlyDigits(value).slice(0, 11);
  if(d.length <= 2) return d.length ? "(" + d : "";
  if(d.length <= 7) return "(" + d.slice(0,2) + ") " + d.slice(2);
  return "(" + d.slice(0,2) + ") " + d.slice(2,7) + "-" + d.slice(7);
}

function isValidPhone(value){
  var d = onlyDigits(value);
  return d.length === 10 || d.length === 11;
}

function isValidPassword(value){
  return String(value || "").length >= 4;
}

// Monta um link wa.me (grátis, sem API paga) com mensagem pré-preenchida.
// O campo salvo em barberConfig.whatsapp guarda só DDD+número (mesma
// máscara do telefone do cliente), então sempre prefixamos o código do
// Brasil (55) antes de montar o link.
function waLink(phoneRaw, message){
  var digits = onlyDigits(phoneRaw);
  if(!digits) return null;
  if(digits.length <= 11){ digits = "55" + digits; }
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
}

function buildBookingWaMessage(confirmed){
  return "Olá! Quero confirmar meu agendamento na Barbearia B31:\n" +
    "Serviço: " + confirmed.serviceName + "\n" +
    "Data: " + confirmed.dateLabel + "\n" +
    "Horário: " + confirmed.time + "\n" +
    "Cliente: " + (state.clientSession ? state.clientSession.name : "");
}

function buildCancelWaMessage(appt){
  var dateLabel = appt.date.split("-").reverse().join("/");
  return "Olá! Preciso cancelar meu agendamento na Barbearia B31:\n" +
    "Serviço: " + appt.serviceName + "\n" +
    "Data: " + dateLabel + "\n" +
    "Horário: " + appt.time + "\n" +
    "Cliente: " + appt.name;
}

function buildBugReportMailto(context, description){
  var subject = "B31 — Problema relatado (" + context + ")";
  var lines = [
    "Descrição do problema:",
    description || "(não descrito)",
    "",
    "--- Contexto (não apague, ajuda a investigar) ---",
    "Página: " + context,
    "Data/hora: " + nowSP().toLocaleString("pt-BR"),
  ];
  if(context === "cliente" && state.clientSession){
    lines.push("Cliente: " + state.clientSession.name + " (" + state.clientSession.phone + ")");
  }
  var body = lines.join("\n");
  return "mailto:projetos.tecnologia2026@gmail.com?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
}

// Card reaproveitado tanto na tela do cliente quanto no painel do
// barbeiro. Usa mailto: de propósito (sem servidor, sem custo, sem
// depender de nenhuma API externa) — clicar abre o app de e-mail do
// próprio usuário já com o destinatário e a descrição preenchidos.
function bugReportCardHtml(idPrefix){
  return '<div class="card">'+
    '<h2>Encontrou um problema?</h2>'+
    '<p class="sub">Descreva o que aconteceu. Isso vai abrir seu aplicativo de e-mail com a mensagem já preenchida.</p>'+
    '<label for="'+idPrefix+'BugDesc">O que aconteceu?</label>'+
    '<textarea id="'+idPrefix+'BugDesc" rows="3" placeholder="Ex: ao confirmar o agendamento, apareceu uma mensagem de erro e a tela travou..."></textarea>'+
    '<div style="display:flex; gap:16px; align-items:center; margin-top:12px; flex-wrap:wrap;">'+
      '<button class="ghost" id="'+idPrefix+'ReportBtn">Reportar por e-mail</button>'+
      '<span class="backlink" id="'+idPrefix+'BugToggle">Fechar</span>'+
    '</div>'+

// Cria o agendamento numa transação: o documento tem ID determinístico
// (data_horário), e a transação só escreve se ele ainda não existir. Isso
// elimina a corrida de condição de dois clientes confirmando o mesmo
// horário ao mesmo tempo — o segundo sempre recebe SLOT_TAKEN.
async function bookAppointmentTx(appt){
  var id = apptDocId(appt.date, appt.time);
  var ref = doc(db, "appointments", id);
  await runTransaction(db, async function(tx){
    var existing = await tx.get(ref);
    if(existing.exists()){ throw new Error("SLOT_TAKEN"); }
    tx.set(ref, appt);
  });
  return id;
}

// Pulls appointments from Firestore. Needed because each person (client or
// barber) has their own in-memory copy of state — if a client books on
// their phone, the barber's screen doesn't know about it until it re-reads.
// Used on login, on manual refresh, and by the background poll below.
//
// Scoped to the current year onward (not the whole collection): the
// performance panel only ever needs this year's data (saldo semanal,
// mensal e anual), and this runs on a 12s poll while the barber panel is
// open, so pulling every historical appointment ever made would mean the
// read cost — and the payload — keeps growing forever as the shop's
// history piles up. A pending appointment from a previous year that never
// got marked "Realizado" won't show up in the overdue list, but that's an
// edge case worth trading for keeping every regular poll cheap and fast.
async function refreshAppts(){
  try{
    var yearStart = dateKey(new Date(nowSP().getFullYear(), 0, 1));
    var q = query(collection(db, "appointments"), where("date", ">=", yearStart));
    var snap = await getDocs(q);
    var list = [];
    snap.forEach(function(d){ list.push(Object.assign({id: d.id}, d.data())); });
    list.sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
    state.appts = list;
    return true;
  }catch(e){ return false; }
}

// ---------- EXCEÇÕES DE HORÁRIO POR DIA (scheduleOverrides) ----------
// Além da grade semanal recorrente (workDays/workPeriods), o barbeiro pode
// abrir uma exceção pontual pra um dia específico: fechar um dia que
// normalmente atenderia (ex: feriado, folga) ou abrir/ajustar horário num
// dia que normalmente não atenderia (ex: um sábado especial). O documento
// tem o próprio dateKey como ID; guardamos "date" também no corpo pra dar
// pra fazer range query por documentId() sem precisar de índice composto.

function monthKeyStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }

function isMonthUnlocked(d){
  var mk = monthKeyStr(d);
  if(mk === monthKeyStr(nowSP())) return true; // mês corrente sempre liberado
  return (state.config.unlockedMonths || []).indexOf(mk) !== -1;
}

function firstDayOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function lastDayOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }

// Busca as exceções do mês dado, só se ainda não tiverem sido buscadas
// nesta sessão (cache simples em memória por "AAAA-MM").
async function ensureOverridesLoaded(monthDate){
  var mk = monthKeyStr(monthDate);
  if(state.overridesLoadedMonths[mk]) return true;
  try{
    var startKey = dateKey(firstDayOfMonth(monthDate));
    var endKey = dateKey(lastDayOfMonth(monthDate));
    var q = query(collection(db, "scheduleOverrides"),
      where(documentId(), ">=", startKey), where(documentId(), "<=", endKey));
    var snap = await getDocs(q);
    snap.forEach(function(d){ state.scheduleOverrides[d.id] = d.data(); });
    state.overridesLoadedMonths[mk] = true;
    return true;
  }catch(e){ return false; }
}

// Salva (ou remove, se overrideObj for null) a exceção de um dia específico.
async function saveDayOverride(dayKey, overrideObj){
  try{
    if(overrideObj){
      await setDoc(doc(db, "scheduleOverrides", dayKey), Object.assign({date: dayKey}, overrideObj));
      state.scheduleOverrides[dayKey] = overrideObj;
    } else {
      await deleteDoc(doc(db, "scheduleOverrides", dayKey));
      delete state.scheduleOverrides[dayKey];
    }
    return true;
  }catch(e){ return false; }
}

function nextDays(n){
  var out = [];
  var today = nowSP();
  today.setHours(0,0,0,0);
  // O horizonte de agendamento nunca passa do fim do mês corrente, a não
  // ser que o barbeiro já tenha liberado o mês seguinte — por isso o loop
  // para tanto quando junta "n" dias válidos quanto quando sai do
  // horizonte liberado, o que vier primeiro (em vez de um limite fixo de
  // dias corridos que poderia atravessar pra um mês ainda travado).
  var i = 0;
  while(out.length < n && i < 62){
    var d = new Date(today);
    d.setDate(d.getDate() + i);
    i++;
    if(!isMonthUnlocked(d)) break;
    var k = dateKey(d);
    var override = state.scheduleOverrides[k];
    if(override && override.closed) continue;
    var isDefaultWorkDay = state.config.workDays.indexOf(d.getDay()) !== -1;
    var hasCustomPeriods = override && Array.isArray(override.periods) && override.periods.length;
    if(!isDefaultWorkDay && !hasCustomPeriods) continue;
    out.push(d);
  }
  return out;
}

function slotsForDate(d, durationMinutes){
  var slots = [];
  var step = state.config.slotMinutes;
  var duration = durationMinutes || step;
  var isToday = dateKey(d) === dateKey(nowSP());
  var now = nowSP();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var override = state.scheduleOverrides[dateKey(d)];
  if(override && override.closed) return slots;
  var periods = (override && Array.isArray(override.periods) && override.periods.length)
    ? override.periods : state.config.workPeriods;
  periods.forEach(function(period){
    var startMin = period.startHour * 60;
    var endMin = period.endHour * 60;
    for(var m = startMin; m + duration <= endMin; m += step){
      if(isToday && m <= nowMin) continue;
      var h = Math.floor(m/60), mm = m%60;
      slots.push(pad(h)+":"+pad(mm));
    }
  });
  slots.sort();
  return slots;
}

function timeToMinutes(t){
  var parts = t.split(":");
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}

function apptsForDate(dateStr){
  return state.clientDateAppts.filter(function(a){ return a.date === dateStr; });
}

// Checks whether a candidate [startTime, startTime+duration) overlaps any
// existing appointment that day, so a longer service (ex: Corte + Barba)
// correctly blocks out shorter slots that would otherwise fit inside it.
//
// O "intervalo" configurado pelo barbeiro (state.config.slotMinutes) tem
// DOIS papéis: além de ser o passo da grade de horários (11:00, 11:15,
// 11:30...), ele também funciona como um tempo de buffer/limpeza que é
// somado ao fim de CADA agendamento existente. Por isso, um corte de 30min
// às 11:00 com intervalo de 15min ocupa até as 11:45 (não só até as
// 11:30) — o próximo horário realmente livre é 11:45.
function isSlotAvailable(dateStr, startTime, duration){
  var startMin = timeToMinutes(startTime);
  var endMin = startMin + duration;
  var buffer = state.config.slotMinutes;
  var dayAppts = apptsForDate(dateStr);
  for(var i = 0; i < dayAppts.length; i++){
    var a = dayAppts[i];
    var aStart = timeToMinutes(a.time);
    var aDur = a.minutes || state.config.slotMinutes;
    var aEnd = aStart + aDur + buffer;
    if(startMin < aEnd && endMin > aStart){ return false; }
  }
  return true;
}

function isTaken(dateStr, time){
  return !isSlotAvailable(dateStr, time, state.config.slotMinutes);
}

// ---------- BARBER STATS (saldo/trabalhos) ----------
// Instead of keeping a fragile "reset every Monday / every 1st" counter that
// would drift or double count if the barber skips opening the app for a
// while, the weekly/monthly figures are simply recalculated from the
// appointment history every time the panel renders. That naturally "resets"
// the moment a new week/month begins (there's nothing from it yet), while
// the annual total keeps growing all year since it's the same history,
// just filtered by the current year.
function startOfWeek(d){
  var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = date.getDay(); // 0 = domingo
  var diffToMonday = (day === 0 ? -6 : 1 - day);
  date.setDate(date.getDate() + diffToMonday);
  return date;
}

function isCompletedAppt(a, now){
  return a.done === true;
}

// An appointment is "overdue" when its slot has already passed and nobody
// marked it done or cancelled it — the barber forgot, or the client was a
// no-show. These get called out separately in the panel instead of quietly
// blending into the schedule, since a no-show or forgotten confirmation is
// exactly the kind of thing a busy barber can lose track of.
function isOverdueAppt(a, now){
  if(a.done) return false;
  var dt = new Date(a.date + "T" + a.time + ":00");
  return dt.getTime() < now.getTime();
}

function dayHeaderLabel(dstr, todayKey, tomorrowKey){
  if(dstr === todayKey) return "Hoje";
  if(dstr === tomorrowKey) return "Amanhã";
  var parts = dstr.split("-").map(function(n){ return parseInt(n, 10); });
  var d = new Date(parts[0], parts[1] - 1, parts[2]);
  return DOW[d.getDay()] + ", " + dstr.split("-").reverse().slice(0, 2).join("/");
}

// "em 25 min" / "em 2h 10min" for later today, or "Amanhã às 09:00" /
// "Ter, 02/09 às 09:00" for anything past today.
function timeUntilLabel(a, now, todayKey, tomorrowKey){
  var dt = new Date(a.date + "T" + a.time + ":00");
  if(a.date !== todayKey){
    return dayHeaderLabel(a.date, todayKey, tomorrowKey) + " às " + a.time;
  }
  var diffMin = Math.round((dt.getTime() - now.getTime()) / 60000);
  if(diffMin <= 0) return "agora";
  if(diffMin < 60) return "em " + diffMin + " min";
  var h = Math.floor(diffMin / 60), m = diffMin % 60;
  return "em " + h + "h" + (m ? " " + m + "min" : "");
}

function formatBRL(n){
  return "R$ " + (Math.round((n || 0) * 100) / 100).toFixed(2).replace(".", ",");
}

function computeBarberStats(){
  var now = nowSP();
  var weekStartKey = dateKey(startOfWeek(now));
  var monthKey = now.getFullYear() + "-" + pad(now.getMonth() + 1);
  var yearNum = now.getFullYear();

  var stats = {
    weekEarnings: 0, weekJobs: 0,
    monthEarnings: 0, monthJobs: 0,
    yearEarnings: 0, yearJobs: 0,
    year: yearNum
  };

  state.appts.forEach(function(a){
    if(!isCompletedAppt(a, now)) return;
    var price = a.price || 0;
    if(a.date >= weekStartKey){
      stats.weekEarnings += price;
      stats.weekJobs += 1;
    }
    if(a.date.slice(0, 7) === monthKey){
      stats.monthEarnings += price;
      stats.monthJobs += 1;
    }
    if(parseInt(a.date.slice(0, 4), 10) === yearNum){
      stats.yearEarnings += price;
      stats.yearJobs += 1;
    }
  });

  return stats;
}

    errBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Abrindo o Google...";
    try{
      var result = await signInWithPopup(auth, googleProvider);
      var user = result.user;
      var profileSnap = await getDoc(doc(db, "clients", user.uid));
      if(profileSnap.exists() && profileSnap.data().phone){
        var p = profileSnap.data();
        state.clientSession = {uid: user.uid, name: p.name || user.displayName, phone: p.phone, email: p.email || user.email};
        state.screen = "clientApp";
        render();
        refreshClientOwnAppts().then(render);
      } else {
        state.pendingGoogleUser = user;
        state.screen = "clientPhone";
        render();
      }
    }catch(e){
      btn.disabled = false;
      btn.textContent = "Entrar com Google";
      // Se a pessoa simplesmente fechou o popup, não precisa mostrar erro.
      if(e && e.code === "auth/popup-closed-by-user") return;
      errBox.textContent = "Não foi possível entrar com o Google. Tente novamente.";
      errBox.style.display = "block";
    }
  };
}

// Agendamentos futuros (ainda não realizados) do próprio cliente logado —
// usado tanto pra decidir se mostra a aba "Seus agendamentos" quanto pra

function getUpcomingClientAppts(){
  var todayKey = dateKey(nowSP());
  return state.clientOwnAppts.filter(function(a){
    return !a.done && a.date >= todayKey;
  });
}

function renderClientOwnApptsHtml(){
  var upcoming = getUpcomingClientAppts();

  var itemsHtml = upcoming.map(function(a){

    return '<div class="appt">'+
      '<div>'+

      '<div class="appt-actions">'+

function wireClientOwnApptsHandlers(el){
  el.querySelectorAll("[data-clientcancel]").forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-clientcancel");
      var target = state.clientOwnAppts.find(function(a){ return a.id === id; });
      if(!target) return;
      var ok = window.confirm("Cancelar esse agendamento?");
      if(!ok) return;
      btn.disabled = true;
      btn.textContent = "Cancelando...";
      // Abre a aba em branco AGORA, ainda dentro do clique original — celulares
      // (principalmente Safari/iOS) bloqueiam window.open() se ele acontecer só
      // depois de um await, porque nesse ponto o navegador já não considera mais
      // que foi resposta direta a um toque do usuário. Abrindo a aba antes e só
      // preenchendo o destino dela depois, o popup nunca é bloqueado.
      var waTab = state.config.whatsapp ? window.open("", "_blank") : null;
      var okSave = await cancelApptDoc(id);
      if(!okSave){
        if(waTab) waTab.close();
        btn.disabled = false;
        btn.textContent = "Cancelar";
        showToast(saveErrorMessage(), true);
        return;
      }
      state.clientOwnAppts = state.clientOwnAppts.filter(function(a){ return a.id !== id; });
      if(waTab){
        var link = waLink(state.config.whatsapp, buildCancelWaMessage(target));
        if(link){ waTab.location = link; } else { waTab.close(); }
      }
      render();
    };
  });
}

// ---------- CALENDÁRIO DO CLIENTE (visão do mês, mesmo estilo do calendário do barbeiro) ----------

function renderClientCalendarHtml(){
  var monthDate = state.clientCalendarMonth || firstDayOfMonth(nowSP());
  var today = nowSP();
  var todayKey = dateKey(today);
  var isCurrentMonth = monthKeyStr(monthDate) === monthKeyStr(today);
  var first = firstDayOfMonth(monthDate);
  var last = lastDayOfMonth(monthDate);
  var startOffset = first.getDay();
  var daysInMonth = last.getDate();
  var unlocked = isMonthUnlocked(monthDate);

  var cells = [];
  for(var i = 0; i < startOffset; i++){ cells.push('<div class="cal-day cal-empty"></div>'); }
  for(var day = 1; day <= daysInMonth; day++){
    var d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    var k = dateKey(d);
    var override = state.scheduleOverrides[k];
    var isPast = k < todayKey;
    var isToday = k === todayKey;
    var isDefaultWorkDay = state.config.workDays.indexOf(d.getDay()) !== -1;
    var hasCustomPeriods = override && Array.isArray(override.periods) && override.periods.length;
    var isClosed = override && override.closed;
    var isOff = !isClosed && !isDefaultWorkDay && !hasCustomPeriods;
    var isLocked = !unlocked && !isPast;
    var isSelected = k === state.clientSelectedDate;
    var isAvailable = !isPast && !isLocked && !isClosed && !isOff;

    var classes = ["cal-day"];
    if(isToday) classes.push("is-today");
    if(isPast) classes.push("is-past");
    if(isClosed) classes.push("is-closed");
    else if(isOff) classes.push("is-off");
    if(isLocked) classes.push("is-locked");
    if(isAvailable) classes.push("is-available");
    if(isSelected) classes.push("is-selected");

    var label = DOW[d.getDay()]+' dia '+day+(isAvailable ? '' : ', indisponível');
    cells.push('<div class="'+classes.join(" ")+'" '+
      (isAvailable ? 'data-calday="'+k+'" role="button" tabindex="0" aria-pressed="'+isSelected+'"' : 'aria-disabled="true"')+
      ' aria-label="'+label+'">'+
      '<span class="cal-num">'+day+'</span>'+
      (isToday ? '<span class="cal-dot"></span>' : '')+
    '</div>');
  }

  var lockedNoteHtml = !unlocked
    ? '<p class="sub" style="margin-top:10px;">A agenda de '+MONTH_NAMES[monthDate.getMonth()]+' ainda não foi liberada para agendamento.</p>'
    : "";

  return '<div class="cal-wrap">'+
    '<div class="cal-head">'+
      '<div class="cal-nav"><button type="button" data-clicalprev aria-label="Mês anterior"'+(isCurrentMonth ? ' disabled' : '')+'>&larr;</button></div>'+
      '<div class="cal-title">'+MONTH_NAMES[monthDate.getMonth()]+' de '+monthDate.getFullYear()+'</div>'+
      '<div class="cal-nav"><button type="button" data-clicalnext aria-label="Próximo mês">&rarr;</button></div>'+
    '</div>'+
    '<div class="cal-dow">'+DOW.map(function(n){ return '<span>'+n+'</span>'; }).join("")+'</div>'+
    '<div class="cal-grid">'+cells.join("")+'</div>'+
    '<div class="cal-legend">'+
      '<span><span class="dot" style="background:var(--white); border:1px solid var(--line);"></span> Disponível</span>'+
      '<span><span class="dot" style="background:var(--gray-300);"></span> Indisponível</span>'+
      '<span><span class="dot" style="background:var(--black);"></span> Selecionado</span>'+
    '</div>'+
    lockedNoteHtml+
  '</div>';
}

function wireClientCalendarHandlers(el){

  if(prevBtn && !prevBtn.disabled){

// Etapa 1 do agendamento: enquanto nenhum serviço foi escolhido, mostra a
// grade completa; depois de escolhido, recolhe pra uma linha de resumo com
// "trocar" — evita manter o grid de serviços sempre aberto ocupando espaço
// acima do calendário e dos horários.
function renderClientServiceCardHtml(services, selectedSvc){
  if(selectedSvc){
    return '<div class="card">'+
      '<div class="step-summary-row">'+
        '<div>'+
          '<h2 style="padding-bottom:0; margin-bottom:3px;">1. Serviço</h2>'+
          '<p class="sub" style="margin:0;">'+escapeHtml(selectedSvc.name)+' · R$ '+selectedSvc.price+' · '+selectedSvc.minutes+' min</p>'+
        '</div>'+
        '<span class="backlink" id="changeSvcBtn">trocar</span>'+
      '</div>'+
    '</div>';
  }
  var svcHtml = services.map(function(s){
    return '<div class="svc" data-svc="'+s.id+'" aria-pressed="false">'+
      '<div class="name">'+escapeHtml(s.name)+'</div>'+
      '<div class="meta">R$ '+s.price+' · '+s.minutes+' min</div>'+
    '</div>';
  }).join("");
  return '<div class="card">'+
    '<h2>1. Escolha o serviço</h2>'+
    '<div class="services">'+svcHtml+'</div>'+
  '</div>';
}

// Etapas 2 e 3 do agendamento (dia + horário) num único card. Igual ao
// serviço, uma vez que os dois já foram escolhidos, recolhe pra uma linha
// de resumo com "trocar" — sem isso, o calendário do mês inteiro e a grade
// de horários ficavam sempre abertos, mesmo depois de já escolhidos.
function renderClientDateTimeCardHtml(selectedSvc){
  var isComplete = selectedSvc && state.clientSelectedDate && state.clientSelectedSlot;
  if(isComplete){
    return '<div class="card">'+
      '<div class="step-summary-row">'+
        '<div>'+
          '<h2 style="padding-bottom:0; margin-bottom:3px;">2. Dia e horário</h2>'+
          '<p class="sub" style="margin:0;">'+formatDateLabel(state.clientSelectedDate)+' às '+state.clientSelectedSlot+'</p>'+
        '</div>'+
        '<span class="backlink" id="changeDateBtn">trocar</span>'+
      '</div>'+
    '</div>';
  }

  var slotsHtml = '<p class="empty">Escolha um serviço para ver os horários</p>';
  if(selectedSvc && !state.clientSelectedDate){
    slotsHtml = '<p class="empty">Escolha um dia para ver os horários</p>';
  }
  if(selectedSvc && state.clientSelectedDate){
    var selDate = dateFromKey(state.clientSelectedDate);
    var slots = selDate ? slotsForDate(selDate, selectedSvc.minutes) : [];
    if(slots.length === 0){
      slotsHtml = '<p class="empty">Sem horários livres nesse dia pra esse serviço ('+selectedSvc.minutes+' min)</p>';
    } else {
      slotsHtml = '<div class="slots">' + slots.map(function(t){
        var taken = !isSlotAvailable(state.clientSelectedDate, t, selectedSvc.minutes);
        var sel = state.clientSelectedSlot === t;
        var extra = taken ? ' aria-disabled="true" aria-label="'+t+', indisponível"' : ' aria-pressed="'+sel+'" aria-label="'+t+'"';
        return '<div class="slot'+(taken?' taken':'')+(sel?' selected':'')+'" data-slot="'+(taken?'':t)+'"'+extra+'>'+t+'</div>';
      }).join("") + '</div>';
    }
  }

  return '<div class="card">'+
    '<h2>2. Escolha o dia</h2>'+
    renderClientCalendarHtml()+
    '<h2 style="margin-top:18px;">3. Escolha o horário</h2>'+
    slotsHtml+
  '</div>';
}

// Indicador simples de progresso (1 → 2 → 3), pra deixar visualmente claro
// em que ponto do agendamento o cliente está, sem precisar ler os títulos.
function renderClientStepsHtml(step1Done, step2Done){
  var steps = [
    {n:1, label:"Serviço", done: step1Done},
    {n:2, label:"Dia e horário", done: step2Done},
    {n:3, label:"Confirmar", done: false}
  ];
  var current = !step1Done ? 1 : (!step2Done ? 2 : 3);
  return '<div class="step-progress">'+steps.map(function(s){
    var cls = s.done ? "done" : (s.n === current ? "current" : "");
    return '<div class="step-node '+cls+'">'+
      '<span class="step-circle">'+(s.done ? "&#10003;" : s.n)+'</span>'+
      '<span class="step-label">'+s.label+'</span>'+
    '</div>';
  }).join('<div class="step-line"></div>')+'</div>';
}

function renderClientApp(el){
  if(state.clientConfirmed){
    var a = state.clientConfirmed;
    var waConfirmLink = state.config.whatsapp ? waLink(state.config.whatsapp, buildBookingWaMessage(a)) : null;
    var waConfirmHtml = waConfirmLink
      ? '<a class="ghost" href="'+waConfirmLink+'" target="_blank" rel="noopener" style="display:inline-block; text-decoration:none; margin-top:12px;">Não abriu? Confirmar via WhatsApp</a>'
      : "";
    el.innerHTML =
      '<div class="card success-box">'+
        '<div class="badge">&#10003;</div>'+
        '<h2 class="display">Horário confirmado</h2>'+
        '<p class="sub">'+escapeHtml(a.serviceName)+' — '+a.dateLabel+' às '+a.time+'</p>'+
        waConfirmHtml+
        '<div><button class="ghost" id="newBooking" style="margin-top:16px;">Marcar outro horário</button></div>'+
        '<div><span class="backlink" id="logoutClient" style="margin-top:16px;">Sair da conta</span></div>'+
      '</div>'+
      renderClientOwnApptsHtml();
    document.getElementById("newBooking").onclick = function(){
      state.clientConfirmed = null;
      state.clientSelectedService = null;
      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      state.clientView = "book";
      render();
    };
    makeActivatable(document.getElementById("logoutClient"), doClientLogout);
    wireClientOwnApptsHandlers(el);
    return;
  }

  var services = state.config.services;

  var selectedSvc = services.find(function(s){ return s.id === state.clientSelectedService; });

  // Resumo compacto do que já foi escolhido, mostrado logo acima do botão
  // de confirmar — sem isso, o cliente teria que rolar a tela toda pra
  // cima de novo pra conferir serviço/dia/horário antes de confirmar.
  var summaryHtml = "";
  if(selectedSvc && state.clientSelectedDate && state.clientSelectedSlot){
    summaryHtml = '<div class="booking-summary">'+
      '<div><span class="label">Serviço</span><span class="value">'+escapeHtml(selectedSvc.name)+'</span></div>'+
      '<div><span class="label">Quando</span><span class="value">'+formatDateLabel(state.clientSelectedDate)+' às '+state.clientSelectedSlot+'</span></div>'+
      '<div><span class="label">Valor</span><span class="value">R$ '+selectedSvc.price+'</span></div>'+
    '</div>';
  }

  var upcoming = getUpcomingClientAppts();
  var viewToggleHtml = "";
  if(upcoming.length){
    var onBook = state.clientView !== "appts";
    viewToggleHtml = '<div class="view-toggle">'+
      '<button type="button" class="'+(onBook?'active':'')+'" data-clientview="book" aria-pressed="'+onBook+'">Marcar novo horário</button>'+
      '<button type="button" class="'+(!onBook?'active':'')+'" data-clientview="appts" aria-pressed="'+(!onBook)+'">Seus agendamentos ('+upcoming.length+')</button>'+
    '</div>';
  }

  var bodyHtml;
  if(upcoming.length && state.clientView === "appts"){
    bodyHtml = renderClientOwnApptsHtml();
  } else {
    var step1Done = !!selectedSvc;
    var step2Done = !!(selectedSvc && state.clientSelectedDate && state.clientSelectedSlot);
    bodyHtml =
      renderClientStepsHtml(step1Done, step2Done)+
      renderClientServiceCardHtml(services, selectedSvc)+
      renderClientDateTimeCardHtml(selectedSvc)+
      '<div class="card">'+
        summaryHtml+
        '<div id="cliError" class="error" role="alert" aria-live="polite" style="display:none;"></div>'+
        '<button class="primary" id="confirmBtn">Confirmar agendamento</button>'+
      '</div>';
  }

  el.innerHTML =
    renderSessionBarHtml()+
    viewToggleHtml+
    bodyHtml+
    bugReportSectionHtml("client", state.clientBugOpen)+
    openPrivacyLinkHtml();

  wireSessionBarHandlers(el);
  wireBugReportHandlers("client", "cliente");
  wireClientCalendarHandlers(el);
  wirePrivacyLink(el);

  el.querySelectorAll("[data-clientview]").forEach(function(btn){
    btn.onclick = function(){
      state.clientView = btn.getAttribute("data-clientview");
      render();
    };
  });

  if(upcoming.length && state.clientView === "appts"){
    wireClientOwnApptsHandlers(el);
    return;
  }

  var changeSvcBtn = document.getElementById("changeSvcBtn");
  if(changeSvcBtn){
    makeActivatable(changeSvcBtn, function(){
      state.clientSelectedService = null;
      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      render();
    });
  }

  var changeDateBtn = document.getElementById("changeDateBtn");
  if(changeDateBtn){
    makeActivatable(changeDateBtn, function(){
      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      render();
    });
  }

  el.querySelectorAll(".svc").forEach(function(node){
    makeActivatable(node, function(){
      state.clientSelectedService = node.getAttribute("data-svc");
      state.clientSelectedDate = null;
      state.clientSelectedSlot = null;
      render();
    });
  });
  el.querySelectorAll(".slot").forEach(function(node){
    var t = node.getAttribute("data-slot");
    if(!t){
      node.setAttribute("tabindex", "-1");
      return;
    }
    makeActivatable(node, function(){ state.clientSelectedSlot = t; render(); });
  });

  document.getElementById("confirmBtn").onclick = async function(){
    var errBox = document.getElementById("cliError");
    if(!state.clientSelectedService){
      errBox.textContent = "Escolha um serviço.";
      errBox.style.display = "block";
      return;
    }
    if(!state.clientSelectedDate || !state.clientSelectedSlot){
      errBox.textContent = "Escolha o dia e o horário.";
      errBox.style.display = "block";
      return;
    }
    errBox.style.display = "none";
    var btn = document.getElementById("confirmBtn");
    btn.disabled = true;
    btn.textContent = "Confirmando...";

    await refreshClientDateAppts(state.clientSelectedDate);
    var svc = state.config.services.find(function(s){ return s.id === state.clientSelectedService; });
    if(!isSlotAvailable(state.clientSelectedDate, state.clientSelectedSlot, svc.minutes)){
      errBox.textContent = "Esse horário acabou de ser reservado. Escolha outro.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Confirmar agendamento";
      render();
      return;
    }

    var appt = {
      date: state.clientSelectedDate,
      time: state.clientSelectedSlot,
      serviceId: svc.id,
      serviceName: svc.name,
      price: svc.price,
      minutes: svc.minutes,
      name: state.clientSession.name,
      phone: state.clientSession.phone,
      uid: state.clientSession.uid,
      done: false,
      createdAt: Date.now()
    };

    // A checagem acima é só pra UX (evitar mostrar "confirmando" num
    // horário já óbvio como ocupado). A trava real contra dois clientes
    // confirmando o mesmo horário ao mesmo tempo é a transação abaixo.
    // A aba do WhatsApp é aberta em branco JÁ AQUI, antes do await — celulares
    // (principalmente Safari/iOS) bloqueiam window.open() se ele só acontecer
    // depois de uma pausa assíncrona, porque nesse ponto deixa de contar como
    // resposta direta a um toque do usuário. Preenchendo o destino da aba só
    // depois que a gravação terminar, o popup nunca é bloqueado.
    var waTab = state.config.whatsapp ? window.open("", "_blank") : null;
    var newApptId;
    try{
      newApptId = await bookAppointmentTx(appt);
    }catch(e){
      if(waTab) waTab.close();
      if(e && e.message === "SLOT_TAKEN"){
        errBox.textContent = "Esse horário acabou de ser reservado por outra pessoa. Escolha outro.";
      } else {
        errBox.textContent = saveErrorMessage();
      }
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Confirmar agendamento";
      await refreshClientDateAppts(state.clientSelectedDate);
      render();
      return;
    }

    state.clientConfirmed = {
      serviceName: svc.name,
      dateLabel: formatDateLabel(appt.date),
      time: appt.time
    };
    state.clientOwnAppts.push(Object.assign({id: newApptId}, appt));
    if(waTab){
      var waLinkUrl = waLink(state.config.whatsapp, buildBookingWaMessage(state.clientConfirmed));
      if(waLinkUrl){ waTab.location = waLinkUrl; } else { waTab.close(); }
    }
    render();
  };
}

// ---------- BARBER AUTH ----------

function renderBarberAuth(el){
  el.innerHTML =
    '<span class="backlink" id="backLink">&larr; voltar</span>'+
    renderAuthLogo()+
    '<div class="card">'+
      '<h2>Acesso do barbeiro</h2>'+
      '<p class="sub">Área restrita — só você vê os agendamentos aqui.</p>'+
      '<label for="pinInput">PIN de acesso</label>'+
      '<input type="password" id="pinInput" placeholder="****" inputmode="numeric" autocomplete="off">'+
      '<div id="pinError" class="error" role="alert" aria-live="polite" style="display:none;">PIN incorreto.</div>'+
      '<button class="primary" id="pinBtn">Entrar</button>'+
    '</div>';
  var backHandler2 = function(){ state.screen = "landing"; render(); };
  document.getElementById("backLink").setAttribute("tabindex", "0");
  document.getElementById("backLink").setAttribute("role", "button");
  document.getElementById("backLink").onclick = backHandler2;
  document.getElementById("backLink").onkeydown = function(ev){
    if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); backHandler2(); }
  };
  var pinInput = document.getElementById("pinInput");
  async function tryPin(){
    var val = pinInput.value.trim();
    var errBox = document.getElementById("pinError");
    var btn = document.getElementById("pinBtn");
    if(!val){
      pinInput.classList.add("invalid");
      errBox.textContent = "Informe o PIN.";
      errBox.style.display = "block";
      return;
    }
    btn.disabled = true;
    btn.textContent = "Verificando...";
    try{
      // Sessão anônima só pra satisfazer as regras do Firestore (que
      // exigem um usuário autenticado pra ler/escrever barberSecrets). A
      // trava real é a comparação do hash abaixo, feita depois da leitura.
      if(!auth.currentUser){ await signInAnonymously(auth); }
      var secretsSnap = await getDoc(doc(db, "barberSecrets", "main"));
      var pinHash, pinSalt, pinAlgo;
      if(secretsSnap.exists()){
        pinHash = secretsSnap.data().pinHash;
        pinSalt = secretsSnap.data().pinSalt;
        pinAlgo = secretsSnap.data().pinAlgo; // ausente em instalações antigas
      } else {
        // Primeiro acesso depois de passar a hashear o PIN: se ainda
        // existir um PIN em texto puro salvo do jeito antigo, migra ele
        // pra um hash agora (sem o barbeiro precisar fazer nada). Se não
        // existir nada ainda (instalação nova), usa o PIN padrão.
        var legacyPin = (state.config && typeof state.config.pin === "string") ? state.config.pin : DEFAULT_PIN;
        pinSalt = randomHex(16);
        pinHash = await hashPin(legacyPin, pinSalt);
        pinAlgo = PIN_HASH_ALGO;
        await setDoc(doc(db, "barberSecrets", "main"), { pinHash: pinHash, pinSalt: pinSalt, pinAlgo: pinAlgo });
        if(state.config && typeof state.config.pin !== "undefined"){
          try{ await updateDoc(doc(db, "barberConfig", "main"), { pin: deleteField() }); }catch(e){}
          delete state.config.pin;
        }
      }

      var matched;
      if(pinAlgo === PIN_HASH_ALGO){
        var typedHash = await hashPin(val, pinSalt);
        matched = (typedHash === pinHash);
      } else {
        // Hash salvo com o algoritmo antigo (SHA-256 direto). Verifica do
        // jeito antigo e, se bater, já troca pro PBKDF2 na hora — o
        // barbeiro nem percebe, mas da próxima vez em diante o PIN já
        // está protegido com o hash mais forte.
        var legacyTypedHash = await hashPinLegacySha256(val, pinSalt);
        matched = (legacyTypedHash === pinHash);
        if(matched){
          try{
            var upgradedHash = await hashPin(val, pinSalt);
            await setDoc(doc(db, "barberSecrets", "main"), { pinHash: upgradedHash, pinSalt: pinSalt, pinAlgo: PIN_HASH_ALGO });
          }catch(e){ /* login segue normalmente mesmo se o upgrade falhar agora */ }
        }
      }

      if(matched){
        state.barberLoggedIn = true;
        state.screen = "barberApp";
        render();
        refreshAppts().then(render);
        refreshClients().then(render);
      } else {
        btn.disabled = false;
        btn.textContent = "Entrar";
        pinInput.classList.add("invalid");
        errBox.textContent = "PIN incorreto.";
        errBox.style.display = "block";
      }
    }catch(e){
      btn.disabled = false;
      btn.textContent = "Entrar";
      errBox.textContent = "Não foi possível verificar o PIN. Verifique sua conexão.";
      errBox.style.display = "block";
    }
  }
  document.getElementById("pinBtn").onclick = tryPin;
  pinInput.addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); tryPin(); }
    pinInput.classList.remove("invalid");
  });
}

// ---------- CALENDÁRIO DO BARBEIRO (visão do mês + exceção por dia) ----------

function renderBarberCalendarCardHtml(){
  var monthDate = state.barberCalendarMonth;
  var todayKey = dateKey(nowSP());
  var first = firstDayOfMonth(monthDate);
  var last = lastDayOfMonth(monthDate);
  var startOffset = first.getDay();
  var daysInMonth = last.getDate();
  var unlocked = isMonthUnlocked(monthDate);

  // Conta agendamentos por dia usando o histórico já carregado em memória
  // (state.appts cobre o ano corrente inteiro), sem precisar de nova busca.
  var apptCounts = {};
  state.appts.forEach(function(a){
    if(a.date.slice(0,7) === monthKeyStr(monthDate)){
      apptCounts[a.date] = (apptCounts[a.date] || 0) + 1;
    }
  });

  var cells = [];
  for(var i = 0; i < startOffset; i++){ cells.push('<div class="cal-day cal-empty"></div>'); }
  for(var day = 1; day <= daysInMonth; day++){
    var d = new Date(monthDate.getFullYear(), monthDate.getMonth(), day);
    var k = dateKey(d);
    var override = state.scheduleOverrides[k];
    var isPast = k < todayKey;
    var isToday = k === todayKey;
    var isDefaultWorkDay = state.config.workDays.indexOf(d.getDay()) !== -1;
    var hasCustomPeriods = override && Array.isArray(override.periods) && override.periods.length;
    var isClosed = override && override.closed;
    var isOff = !isClosed && !isDefaultWorkDay && !hasCustomPeriods;
    var count = apptCounts[k] || 0;
    var classes = ["cal-day"];
    if(isToday) classes.push("is-today");
    if(isPast) classes.push("is-past");
    if(isClosed) classes.push("is-closed");
    else if(isOff) classes.push("is-off");
    if(count > 0) classes.push("has-appts");
    if(!unlocked && !isPast) classes.push("is-locked");
    if(k === state.barberSelectedDay) classes.push("is-selected");
    cells.push('<div class="'+classes.join(" ")+'" data-calday="'+k+'" role="button" tabindex="0">'+
      '<span class="cal-num">'+day+'</span>'+
      (count > 0 ? '<span class="cal-dot"></span>' : '')+
    '</div>');
  }

  var unlockBoxHtml = "";
  if(!unlocked){
    unlockBoxHtml = '<div class="month-unlock-box">'+
      'Esse mês ainda não está liberado para os clientes agendarem.'+
      '<br><button class="ghost" data-unlockmonth type="button" style="margin-top:8px;">Liberar '+MONTH_NAMES[monthDate.getMonth()]+' para agendamento</button>'+
    '</div>';
  } else if(monthKeyStr(monthDate) !== monthKeyStr(nowSP())){
    unlockBoxHtml = '<div class="month-unlock-box">'+
      'Esse mês está liberado para agendamento.'+
      '<br><button class="ghost" data-lockmonth type="button" style="margin-top:8px;">Bloquear esse mês de novo</button>'+
    '</div>';
  }

  return '<div class="card">'+
    '<h2>Calendário</h2>'+
    '<p class="sub">Toque num dia pra ver os clientes marcados ou ajustar o horário só daquele dia.</p>'+
    '<div class="cal-head">'+
      '<div class="cal-nav"><button type="button" data-calprev aria-label="Mês anterior">&larr;</button></div>'+
      '<div class="cal-title">'+MONTH_NAMES[monthDate.getMonth()]+' de '+monthDate.getFullYear()+'</div>'+
      '<div class="cal-nav"><button type="button" data-calnext aria-label="Próximo mês">&rarr;</button></div>'+
    '</div>'+
    '<div class="cal-dow">'+DOW.map(function(n){ return '<span>'+n+'</span>'; }).join("")+'</div>'+
    '<div class="cal-grid">'+cells.join("")+'</div>'+
    '<div class="cal-legend">'+
      '<span><span class="dot" style="background:var(--gold-dark);"></span> Tem agendamento</span>'+
      '<span><span class="dot" style="background:var(--gray-300);"></span> Não atende</span>'+
    '</div>'+
    unlockBoxHtml+
    renderDayEditorHtml()+
  '</div>';
}

      '<button class="ghost" id="closeDayEditorBtn" type="button">Fechar</button>'+
    '</div>'+

function wireBarberCalendarHandlers(el){

  if(prevBtn){
    prevBtn.onclick = function(){
      var m = state.barberCalendarMonth;
      state.barberCalendarMonth = new Date(m.getFullYear(), m.getMonth()-1, 1);
      state.barberSelectedDay = null;
      state.barberDayDraft = null;
      render();
      ensureOverridesLoaded(state.barberCalendarMonth).then(render);
    };
  }
  var nextBtn = el.querySelector("[data-calnext]");
  if(nextBtn){
    nextBtn.onclick = function(){
      var m = state.barberCalendarMonth;
      state.barberCalendarMonth = new Date(m.getFullYear(), m.getMonth()+1, 1);
      state.barberSelectedDay = null;
      state.barberDayDraft = null;
      render();
      ensureOverridesLoaded(state.barberCalendarMonth).then(render);
    };
  }

  el.querySelectorAll("[data-calday]").forEach(function(cell){
    makeActivatable(cell, function(){
      var k = cell.getAttribute("data-calday");
      if(state.barberSelectedDay === k){
        state.barberSelectedDay = null;
        state.barberDayDraft = null;
      } else {
        state.barberSelectedDay = k;
        var existing = state.scheduleOverrides[k];
        state.barberDayDraft = existing
          ? {
              closed: !!existing.closed,
              periods: (existing.periods && existing.periods.length)
                ? JSON.parse(JSON.stringify(existing.periods))
                : JSON.parse(JSON.stringify(state.config.workPeriods))
            }
          : { closed: false, periods: JSON.parse(JSON.stringify(state.config.workPeriods)) };
      }
      render();
    });
  });

  var unlockBtn = el.querySelector("[data-unlockmonth]");
  if(unlockBtn){
    unlockBtn.onclick = async function(){
      var mk = monthKeyStr(state.barberCalendarMonth);
      var previous = state.config.unlockedMonths.slice();
      if(state.config.unlockedMonths.indexOf(mk) === -1) state.config.unlockedMonths.push(mk);
      unlockBtn.disabled = true;
      var ok = await saveConfig();
      if(!ok){
        state.config.unlockedMonths = previous;
        showToast(saveErrorMessage(), true);
        render();
        return;
      }
      render();
    };
  }

  var lockBtn = el.querySelector("[data-lockmonth]");
  if(lockBtn){
    lockBtn.onclick = async function(){
      var mk = monthKeyStr(state.barberCalendarMonth);
      var previous = state.config.unlockedMonths.slice();
      var idx = state.config.unlockedMonths.indexOf(mk);
      if(idx !== -1) state.config.unlockedMonths.splice(idx, 1);
      lockBtn.disabled = true;
      var ok = await saveConfig();
      if(!ok){
        state.config.unlockedMonths = previous;
        showToast(saveErrorMessage(), true);
        render();
        return;
      }
      render();
    };
  }

  var dayClosedChk = document.getElementById("dayClosedChk");
  if(dayClosedChk){
    dayClosedChk.onchange = function(){
      state.barberDayDraft.closed = dayClosedChk.checked;
      render();
    };
  }

  var addDayPeriodBtn = document.getElementById("addDayPeriodBtn");
  if(addDayPeriodBtn){
    addDayPeriodBtn.onclick = function(){
      if(state.barberDayDraft.periods.length >= 6){
        showToast("Máximo de 6 períodos por dia.", true);
        return;
      }
      var last = state.barberDayDraft.periods[state.barberDayDraft.periods.length - 1];
      var suggestedStart = Math.min(last.endHour + 1, 22);
      var suggestedEnd = Math.min(suggestedStart + 2, 23);
      state.barberDayDraft.periods.push({startHour: suggestedStart, endHour: suggestedEnd});
      render();
    };
  }

  el.querySelectorAll("[data-dayremoveperiod]").forEach(function(btn){
    btn.onclick = function(){
      var idx = parseInt(btn.getAttribute("data-dayremoveperiod"), 10);
      state.barberDayDraft.periods.splice(idx, 1);
      render();
    };
  });

  var saveDayBtn = document.getElementById("saveDayBtn");
  if(saveDayBtn){
    saveDayBtn.onclick = async function(){
      var k = state.barberSelectedDay;
      var draft = state.barberDayDraft;
      var savedMsg = document.getElementById("daySaved");
      var overrideToSave;
      if(draft.closed){
        overrideToSave = {closed: true, periods: []};
      } else {
        var rows = el.querySelectorAll("[data-day-period-row]");
        var periods = [];
        var invalid = false;
        rows.forEach(function(row){
          var sh = parseInt(row.querySelector('[data-day-period-field="startHour"]').value, 10);
          var eh = parseInt(row.querySelector('[data-day-period-field="endHour"]').value, 10);
          if(isNaN(sh) || isNaN(eh) || sh < 0 || sh > 23 || eh < 1 || eh > 24 || sh >= eh){ invalid = true; }
          periods.push({startHour: sh, endHour: eh});
        });
        periods.sort(function(a,b){ return a.startHour - b.startHour; });
        for(var i = 1; i < periods.length; i++){
          if(periods[i].startHour < periods[i-1].endHour){ invalid = true; }
        }
        if(!periods.length || invalid){
          savedMsg.textContent = "Confira os períodos desse dia (0-23h, sem se sobrepor).";
          savedMsg.style.display = "block";
          return;
        }
        overrideToSave = {closed: false, periods: periods};
      }
      saveDayBtn.disabled = true;
      saveDayBtn.textContent = "Salvando...";
      var ok = await saveDayOverride(k, overrideToSave);
      if(!ok){
        saveDayBtn.disabled = false;
        saveDayBtn.textContent = "Salvar horário desse dia";
        savedMsg.textContent = saveErrorMessage();
        savedMsg.style.display = "block";
        return;
      }
      state.barberDayDraft = overrideToSave;
      render();
    };
  }

  var resetDayBtn = document.getElementById("resetDayBtn");
  if(resetDayBtn){
    resetDayBtn.onclick = async function(){
      var k = state.barberSelectedDay;
      resetDayBtn.disabled = true;
      var ok = await saveDayOverride(k, null);
      if(!ok){
        resetDayBtn.disabled = false;
        showToast(saveErrorMessage(), true);
        return;
      }
      state.barberDayDraft = {closed: false, periods: JSON.parse(JSON.stringify(state.config.workPeriods))};
      render();
    };
  }

  var closeDayEditorBtn = document.getElementById("closeDayEditorBtn");
  if(closeDayEditorBtn){
    closeDayEditorBtn.onclick = function(){
      state.barberSelectedDay = null;
      state.barberDayDraft = null;
      render();
    };
  }
}
